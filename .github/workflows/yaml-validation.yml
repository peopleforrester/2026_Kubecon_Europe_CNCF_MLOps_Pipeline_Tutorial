# ABOUTME: YAML validation workflow for Kubernetes manifests
# ABOUTME: Validates all YAML files against Kubernetes schemas using kubeconform
name: YAML Validation

on:
  push:
    paths:
      - '**.yaml'
      - '**.yml'
      - 'scripts/validate-yaml.sh'
  pull_request:
    paths:
      - '**.yaml'
      - '**.yml'
      - 'scripts/validate-yaml.sh'
  workflow_dispatch:
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'

permissions:
  contents: read

jobs:
  validate:
    name: Validate YAML Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install kubeconform
        run: |
          VERSION="0.6.4"
          wget -q "https://github.com/yannh/kubeconform/releases/download/v${VERSION}/kubeconform-linux-amd64.tar.gz"
          tar xzf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/
          rm kubeconform-linux-amd64.tar.gz
          kubeconform -v

      - name: Run YAML validation
        run: |
          chmod +x scripts/validate-yaml.sh
          ./scripts/validate-yaml.sh

      - name: Upload validation results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yaml-validation-results
          path: |
            **/*.yaml
            **/*.yml
          retention-days: 7
