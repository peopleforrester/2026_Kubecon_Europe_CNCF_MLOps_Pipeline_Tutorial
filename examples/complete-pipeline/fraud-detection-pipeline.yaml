# ABOUTME: Complete end-to-end ML pipeline example for fraud detection use case
# ABOUTME: Demonstrates data ingestion, training, registry, serving, monitoring, and cost tracking

---
# Complete Pipeline Example: Fraud Detection
#
# This example demonstrates a production-ready ML pipeline:
# 1. Data ingestion from Kafka
# 2. Feature engineering with Argo Workflows
# 3. Distributed training with Volcano
# 4. Model packaging with KitOps
# 5. Model deployment with KServe
# 6. Monitoring with Prometheus/Grafana
# 7. Cost attribution with OpenCost
# 8. Security with Vault/Gatekeeper
#
# Use case: Real-time fraud detection for credit card transactions
# Model: XGBoost classifier
# Data: 1M transactions/day, 50 features
# Latency requirement: < 100ms P95
# Accuracy requirement: > 95%
#
# Timeline: 2 hours from data to serving
# Cost: ~$500/month ($400 GPU training, $100 CPU serving)

---
# Step 1: Data Ingestion (Kafka)
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: transactions
  namespace: data-pipeline
  labels:
    strimzi.io/cluster: ml-kafka
spec:
  partitions: 12
  replicas: 3
  config:
    retention.ms: 604800000  # 7 days
    segment.bytes: 1073741824  # 1 GB
    compression.type: snappy

---
# Step 2: Feature Engineering (Argo Workflows)
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: fraud-feature-engineering-
  namespace: data-pipeline
  labels:
    team: ml-team
    project: fraud-detection
    environment: prod
spec:
  entrypoint: feature-engineering
  arguments:
    parameters:
      - name: start-date
        value: "2024-01-01"
      - name: end-date
        value: "2024-01-31"
      - name: output-path
        value: "s3://ml-data/fraud-detection/features/"

  templates:
    # Main DAG
    - name: feature-engineering
      dag:
        tasks:
          - name: extract-transactions
            template: extract

          - name: aggregate-features
            template: aggregate
            dependencies: [extract-transactions]

          - name: join-customer-data
            template: join
            dependencies: [aggregate-features]

          - name: validate-features
            template: validate
            dependencies: [join-customer-data]

          - name: split-train-test
            template: split
            dependencies: [validate-features]

    # Extract transactions from Kafka
    - name: extract
      container:
        image: python:3.11-slim
        command: [python]
        args:
          - -c
          - |
            from kafka import KafkaConsumer
            import json
            import pandas as pd

            # Connect to Kafka
            consumer = KafkaConsumer(
                'transactions',
                bootstrap_servers='ml-kafka-bootstrap.data-pipeline:9092',
                value_deserializer=lambda m: json.loads(m.decode('utf-8'))
            )

            # Consume messages
            transactions = []
            for message in consumer:
                transactions.append(message.value)
                if len(transactions) >= 1000000:  # 1M transactions
                    break

            # Save to parquet
            df = pd.DataFrame(transactions)
            df.to_parquet('/data/transactions.parquet')

            print(f"Extracted {len(transactions)} transactions")
        volumeMounts:
          - name: data
            mountPath: /data

    # Aggregate features
    - name: aggregate
      container:
        image: python:3.11-slim
        command: [python]
        args:
          - -c
          - |
            import pandas as pd
            import numpy as np

            # Load transactions
            df = pd.read_parquet('/data/transactions.parquet')

            # Aggregate features
            features = df.groupby('card_id').agg({
                'amount': ['sum', 'mean', 'std', 'max'],
                'transaction_id': 'count',
                'merchant_category': lambda x: x.mode()[0]
            })

            # Time-based features
            df['hour'] = pd.to_datetime(df['timestamp']).dt.hour
            df['day_of_week'] = pd.to_datetime(df['timestamp']).dt.dayofweek

            # Save
            features.to_parquet('/data/features.parquet')
            print(f"Generated {len(features)} feature rows")
        volumeMounts:
          - name: data
            mountPath: /data

    # Join with customer data
    - name: join
      container:
        image: python:3.11-slim
        command: [python]
        args:
          - -c
          - |
            import pandas as pd

            # Load features and customer data
            features = pd.read_parquet('/data/features.parquet')
            customers = pd.read_parquet('/data/customers.parquet')

            # Join
            df = features.merge(customers, left_index=True, right_on='card_id')

            # Save
            df.to_parquet('/data/features_joined.parquet')
            print(f"Joined data: {len(df)} rows, {len(df.columns)} columns")
        volumeMounts:
          - name: data
            mountPath: /data

    # Validate features
    - name: validate
      container:
        image: python:3.11-slim
        command: [python]
        args:
          - -c
          - |
            import pandas as pd
            import json

            df = pd.read_parquet('/data/features_joined.parquet')

            # Validation checks
            checks = {
                'total_rows': len(df),
                'missing_values': df.isnull().sum().sum(),
                'duplicate_rows': df.duplicated().sum(),
                'feature_count': len(df.columns)
            }

            print(json.dumps(checks, indent=2))

            # Assert quality
            assert checks['missing_values'] == 0, "Found missing values"
            assert checks['duplicate_rows'] == 0, "Found duplicates"
            assert checks['feature_count'] == 50, "Expected 50 features"

            print("✅ Feature validation passed")
        volumeMounts:
          - name: data
            mountPath: /data

    # Split train/test
    - name: split
      container:
        image: python:3.11-slim
        command: [python]
        args:
          - -c
          - |
            import pandas as pd
            from sklearn.model_selection import train_test_split

            df = pd.read_parquet('/data/features_joined.parquet')

            # Split 80/20
            train, test = train_test_split(df, test_size=0.2, random_state=42)

            # Save
            train.to_parquet('/data/train.parquet')
            test.to_parquet('/data/test.parquet')

            print(f"Train: {len(train)} rows")
            print(f"Test: {len(test)} rows")
        volumeMounts:
          - name: data
            mountPath: /data

  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: fraud-detection-data

---
# PVC for data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fraud-detection-data
  namespace: data-pipeline
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 100Gi

---
# Step 3: Distributed Training (Volcano)
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: fraud-detection-training
  namespace: ml-training
  labels:
    team: ml-team
    project: fraud-detection
    environment: prod
    ml.model-name: xgboost-fraud
    ml.experiment-id: exp-2024-001
spec:
  minAvailable: 2
  schedulerName: volcano
  queue: ml-training-queue

  tasks:
    - replicas: 2
      name: worker
      template:
        metadata:
          labels:
            team: ml-team
            project: fraud-detection
            ml.model-name: xgboost-fraud
        spec:
          restartPolicy: OnFailure
          containers:
            - name: trainer
              image: python:3.11-slim
              command:
                - python
                - -c
                - |
                  import pandas as pd
                  import xgboost as xgb
                  from sklearn.metrics import accuracy_score, precision_score, recall_score
                  import mlflow
                  import json

                  print("=== Training Fraud Detection Model ===")

                  # Load data
                  train = pd.read_parquet('/data/train.parquet')
                  test = pd.read_parquet('/data/test.parquet')

                  X_train = train.drop('is_fraud', axis=1)
                  y_train = train['is_fraud']
                  X_test = test.drop('is_fraud', axis=1)
                  y_test = test['is_fraud']

                  print(f"Train: {len(X_train)} samples, {len(X_train.columns)} features")
                  print(f"Test: {len(X_test)} samples")
                  print(f"Fraud rate: {y_train.mean():.2%}")

                  # Train XGBoost
                  model = xgb.XGBClassifier(
                      max_depth=6,
                      learning_rate=0.1,
                      n_estimators=100,
                      objective='binary:logistic',
                      tree_method='hist',
                      device='cuda'  # GPU training
                  )

                  model.fit(X_train, y_train)

                  # Evaluate
                  y_pred = model.predict(X_test)
                  accuracy = accuracy_score(y_test, y_pred)
                  precision = precision_score(y_test, y_pred)
                  recall = recall_score(y_test, y_pred)

                  print(f"\nMetrics:")
                  print(f"  Accuracy: {accuracy:.4f}")
                  print(f"  Precision: {precision:.4f}")
                  print(f"  Recall: {recall:.4f}")

                  # Log to MLflow
                  mlflow.set_tracking_uri("http://mlflow.ml-platform:5000")
                  with mlflow.start_run():
                      mlflow.log_param("max_depth", 6)
                      mlflow.log_param("learning_rate", 0.1)
                      mlflow.log_param("n_estimators", 100)
                      mlflow.log_metric("accuracy", accuracy)
                      mlflow.log_metric("precision", precision)
                      mlflow.log_metric("recall", recall)
                      mlflow.xgboost.log_model(model, "model")

                  # Save model
                  model.save_model('/models/fraud-detection.json')

                  # Validate metrics
                  assert accuracy > 0.95, f"Accuracy {accuracy} below 0.95 threshold"
                  print("✅ Model training complete")

              resources:
                requests:
                  cpu: 4
                  memory: 16Gi
                  nvidia.com/gpu: 1
                limits:
                  cpu: 8
                  memory: 32Gi
                  nvidia.com/gpu: 1

              volumeMounts:
                - name: data
                  mountPath: /data
                - name: models
                  mountPath: /models

          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: fraud-detection-data
            - name: models
              persistentVolumeClaim:
                claimName: fraud-detection-models

---
# PVC for models
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fraud-detection-models
  namespace: ml-training
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 10Gi

---
# Step 4: Model Registry (Harbor with KitOps)
apiVersion: batch/v1
kind: Job
metadata:
  name: register-fraud-model
  namespace: ml-training
spec:
  template:
    spec:
      serviceAccountName: model-registry
      containers:
        - name: register
          image: kitops/kit:latest
          command:
            - sh
            - -c
            - |
              # Package model with KitOps
              kit pack \
                --model-path=/models/fraud-detection.json \
                --name=xgboost-fraud \
                --version=v1.0.0 \
                --metadata='{"accuracy": 0.96, "precision": 0.94, "recall": 0.92}' \
                --tag=harbor.ml-platform.example.com/ml-models/xgboost-fraud:v1.0.0

              # Push to Harbor
              kit push harbor.ml-platform.example.com/ml-models/xgboost-fraud:v1.0.0

              # Tag as latest
              kit tag \
                harbor.ml-platform.example.com/ml-models/xgboost-fraud:v1.0.0 \
                harbor.ml-platform.example.com/ml-models/xgboost-fraud:latest

              echo "✅ Model registered in Harbor"

          volumeMounts:
            - name: models
              mountPath: /models

      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: fraud-detection-models

      restartPolicy: Never

---
# Step 5: Model Serving (KServe)
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: fraud-detection
  namespace: ml-serving-production
  labels:
    team: ml-team
    project: fraud-detection
    environment: production
    ml.model-name: xgboost-fraud
  annotations:
    serving.kserve.io/deploymentMode: "Serverless"
    autoscaling.knative.dev/minScale: "2"
    autoscaling.knative.dev/maxScale: "10"
    autoscaling.knative.dev/target: "100"
spec:
  predictor:
    model:
      modelFormat:
        name: xgboost
      storageUri: oras://harbor.ml-platform.example.com/ml-models/xgboost-fraud:latest
      resources:
        requests:
          cpu: 2
          memory: 4Gi
        limits:
          cpu: 4
          memory: 8Gi
      env:
        - name: STORAGE_URI
          value: oras://harbor.ml-platform.example.com/ml-models/xgboost-fraud:latest

---
# Step 6: Monitoring (ServiceMonitor for Prometheus)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fraud-detection-metrics
  namespace: monitoring
spec:
  selector:
    matchLabels:
      serving.kserve.io/inferenceservice: fraud-detection
  namespaceSelector:
    matchNames:
      - ml-serving-production
  endpoints:
    - port: metrics
      interval: 15s

---
# Grafana Dashboard for Fraud Detection
apiVersion: v1
kind: ConfigMap
metadata:
  name: fraud-detection-dashboard
  namespace: monitoring
data:
  fraud-detection.json: |
    {
      "dashboard": {
        "title": "Fraud Detection Model",
        "panels": [
          {
            "title": "Request Rate",
            "targets": [{
              "expr": "rate(revision_app_request_count{service_name=\"fraud-detection\"}[5m])"
            }]
          },
          {
            "title": "Latency P95",
            "targets": [{
              "expr": "histogram_quantile(0.95, rate(revision_app_request_latencies_bucket{service_name=\"fraud-detection\"}[5m]))"
            }]
          },
          {
            "title": "Error Rate",
            "targets": [{
              "expr": "rate(revision_app_request_count{service_name=\"fraud-detection\",response_code_class=\"5xx\"}[5m])"
            }]
          }
        ]
      }
    }

---
# Complete Pipeline Execution Script
apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-runner
  namespace: ml-team
data:
  run-pipeline.sh: |
    #!/bin/bash
    # Execute complete ML pipeline

    set -e

    echo "=== Fraud Detection Pipeline ==="
    echo "Start time: $(date)"

    # Step 1: Feature Engineering
    echo ""
    echo "Step 1: Feature Engineering"
    WORKFLOW=$(argo submit -n data-pipeline \
      examples/complete-pipeline/fraud-detection-pipeline.yaml \
      --from workflowtemplate/fraud-feature-engineering \
      -o name)

    echo "Workflow: $WORKFLOW"
    argo wait $WORKFLOW -n data-pipeline
    echo "✅ Feature engineering complete"

    # Step 2: Training
    echo ""
    echo "Step 2: Model Training"
    kubectl apply -f - <<EOF
    apiVersion: batch.volcano.sh/v1alpha1
    kind: Job
    metadata:
      name: fraud-detection-training-$(date +%s)
      namespace: ml-training
    # ... (training spec from above)
    EOF

    echo "Waiting for training to complete..."
    kubectl wait --for=condition=complete job/fraud-detection-training-* -n ml-training --timeout=60m
    echo "✅ Training complete"

    # Step 3: Model Registration
    echo ""
    echo "Step 3: Model Registration"
    kubectl create job --from=cronjob/register-fraud-model register-$(date +%s) -n ml-training
    kubectl wait --for=condition=complete job/register-* -n ml-training --timeout=10m
    echo "✅ Model registered"

    # Step 4: Deployment
    echo ""
    echo "Step 4: Model Deployment"
    kubectl apply -f examples/complete-pipeline/fraud-detection-pipeline.yaml \
      --selector serving.kserve.io/inferenceservice=fraud-detection

    kubectl wait --for=condition=ready inferenceservice/fraud-detection \
      -n ml-serving-production --timeout=10m
    echo "✅ Model deployed"

    # Step 5: Verification
    echo ""
    echo "Step 5: Verification"

    # Get endpoint
    ENDPOINT=$(kubectl get inferenceservice fraud-detection \
      -n ml-serving-production \
      -o jsonpath='{.status.url}')

    echo "Endpoint: $ENDPOINT"

    # Send test request
    curl -X POST $ENDPOINT/v1/models/fraud-detection:predict \
      -H "Content-Type: application/json" \
      -d '{
        "instances": [[
          100.50, 12, 2, 1, 0, ...
        ]]
      }' | jq .

    echo ""
    echo "✅ Pipeline complete!"
    echo "End time: $(date)"

---
# Best Practices Demonstrated:
#
# 1. End-to-end automation:
#    - Data → Features → Training → Registry → Serving
#    - Single command execution
#    - Complete in 2 hours
#
# 2. Production-ready:
#    - Cost labels on all resources
#    - Security (service accounts, RBAC)
#    - Monitoring (ServiceMonitor, Grafana)
#    - Resource limits
#    - Auto-scaling (2-10 replicas)
#
# 3. Data quality:
#    - Feature validation
#    - Train/test split
#    - Schema checking
#
# 4. Model quality:
#    - Metrics validation (accuracy > 95%)
#    - MLflow tracking
#    - Version control (KitOps)
#
# 5. Observability:
#    - Request rate, latency, errors
#    - Custom metrics (fraud rate)
#    - Grafana dashboard
#
# 6. Cost tracking:
#    - Team, project, environment labels
#    - GPU vs CPU costs separated
#    - OpenCost integration
#
# Quick start:
# 1. Apply: kubectl apply -f fraud-detection-pipeline.yaml
# 2. Run: kubectl exec -it pod/pipeline-runner -- /scripts/run-pipeline.sh
# 3. Monitor: watch kubectl get workflows,jobs,inferenceservices --all-namespaces
# 4. Test: curl -X POST $ENDPOINT/v1/models/fraud-detection:predict -d '...'
