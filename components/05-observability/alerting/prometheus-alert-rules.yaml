# ABOUTME: Prometheus alert rules for ML platform (training, serving, GPU, cost anomalies)
# ABOUTME: Production-ready alerts with severity levels, runbooks, and notification routing

---
# PrometheusRule CRD for ML-specific alerts
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ml-platform-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
spec:
  groups:
    # Alert Group 1: Model Serving Alerts
    - name: model-serving
      interval: 30s
      rules:
        # High error rate
        - alert: ModelServingHighErrorRate
          expr: |
            (
              sum(rate(revision_app_request_count{namespace="ml-serving",response_code_class="5xx"}[5m]))
              /
              sum(rate(revision_app_request_count{namespace="ml-serving"}[5m]))
            ) > 0.01
          for: 5m
          labels:
            severity: critical
            component: serving
          annotations:
            summary: "High error rate for model {{ $labels.service_name }}"
            description: "Error rate is {{ $value | humanizePercentage }}. More than 1% of requests are failing."
            runbook_url: "https://runbooks.example.com/model-serving-high-error-rate"

        # High latency
        - alert: ModelServingHighLatency
          expr: |
            histogram_quantile(0.99,
              sum(rate(revision_app_request_latencies_bucket{namespace="ml-serving"}[5m])) by (le, service_name)
            ) > 0.5
          for: 10m
          labels:
            severity: warning
            component: serving
          annotations:
            summary: "High latency for model {{ $labels.service_name }}"
            description: "P99 latency is {{ $value | humanizeDuration }}. Above 500ms threshold."

        # No healthy replicas
        - alert: ModelServingNoHealthyReplicas
          expr: |
            kube_deployment_status_replicas_available{namespace="ml-serving"} == 0
          for: 5m
          labels:
            severity: critical
            component: serving
          annotations:
            summary: "No healthy replicas for {{ $labels.deployment }}"
            description: "Model serving deployment has 0 available replicas. Service is down!"
            runbook_url: "https://runbooks.example.com/model-serving-no-replicas"

        # Autoscaler stuck at max
        - alert: ModelServingAutoscalerMaxedOut
          expr: |
            autoscaler_actual_pods{namespace="ml-serving"}
            ==
            autoscaler_max_pods{namespace="ml-serving"}
          for: 15m
          labels:
            severity: warning
            component: serving
          annotations:
            summary: "Autoscaler maxed out for {{ $labels.service_name }}"
            description: "Autoscaler is at maximum replicas ({{ $value }}). May need to increase maxScale."

        # Frequent cold starts
        - alert: ModelServingFrequentColdStarts
          expr: |
            rate(activator_request_count{namespace="ml-serving"}[10m]) > 0.1
          for: 30m
          labels:
            severity: warning
            component: serving
          annotations:
            summary: "Frequent cold starts for {{ $labels.service_name }}"
            description: "Cold start rate is {{ $value | humanize }} req/s. Consider increasing minScale."

    # Alert Group 2: Training Job Alerts
    - name: training-jobs
      interval: 1m
      rules:
        # Training job failed
        - alert: TrainingJobFailed
          expr: |
            kube_job_status_failed{namespace="ml-training"} > 0
          for: 0m
          labels:
            severity: warning
            component: training
          annotations:
            summary: "Training job {{ $labels.job_name }} failed"
            description: "Training job has failed. Check logs for details."
            runbook_url: "https://runbooks.example.com/training-job-failed"

        # Training job stuck
        - alert: TrainingJobStuck
          expr: |
            (time() - kube_job_status_start_time{namespace="ml-training"})
            > (3600 * 24)
            and
            kube_job_status_active{namespace="ml-training"} > 0
          for: 30m
          labels:
            severity: warning
            component: training
          annotations:
            summary: "Training job {{ $labels.job_name }} running for > 24 hours"
            description: "Job has been running for {{ $value | humanizeDuration }}. May be stuck."

        # High training job failure rate
        - alert: HighTrainingJobFailureRate
          expr: |
            (
              sum(rate(kube_job_status_failed{namespace="ml-training"}[1h]))
              /
              sum(rate(kube_job_complete{namespace="ml-training"}[1h]))
            ) > 0.2
          for: 30m
          labels:
            severity: warning
            component: training
          annotations:
            summary: "High training job failure rate"
            description: "{{ $value | humanizePercentage }} of training jobs are failing in the last hour."

        # OOM kills
        - alert: TrainingJobOOMKilled
          expr: |
            kube_pod_container_status_last_terminated_reason{namespace="ml-training",reason="OOMKilled"} == 1
          for: 0m
          labels:
            severity: warning
            component: training
          annotations:
            summary: "Training pod {{ $labels.pod }} OOM killed"
            description: "Pod was killed due to out of memory. Increase memory limits."
            runbook_url: "https://runbooks.example.com/training-oom"

    # Alert Group 3: GPU Alerts
    - name: gpu-health
      interval: 30s
      rules:
        # GPU utilization too low
        - alert: GPUUtilizationLow
          expr: |
            avg(DCGM_FI_DEV_GPU_UTIL) < 20
          for: 30m
          labels:
            severity: info
            component: gpu
          annotations:
            summary: "Low GPU utilization across cluster"
            description: "Average GPU utilization is {{ $value | humanize }}%. GPUs may be underutilized."

        # GPU temperature high
        - alert: GPUTemperatureHigh
          expr: |
            DCGM_FI_DEV_GPU_TEMP > 85
          for: 10m
          labels:
            severity: warning
            component: gpu
          annotations:
            summary: "High GPU temperature on {{ $labels.instance }}"
            description: "GPU temperature is {{ $value }}°C. Above 85°C threshold."
            runbook_url: "https://runbooks.example.com/gpu-temperature-high"

        # GPU memory almost full
        - alert: GPUMemoryAlmostFull
          expr: |
            (DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE)) > 0.95
          for: 15m
          labels:
            severity: warning
            component: gpu
          annotations:
            summary: "GPU memory almost full on {{ $labels.instance }}"
            description: "GPU memory usage is {{ $value | humanizePercentage }}. Running low on memory."

        # GPU not reporting metrics
        - alert: GPUMetricsNotReporting
          expr: |
            up{job="dcgm-exporter"} == 0
          for: 5m
          labels:
            severity: critical
            component: gpu
          annotations:
            summary: "DCGM exporter down on {{ $labels.instance }}"
            description: "Not receiving GPU metrics. DCGM exporter may be down."
            runbook_url: "https://runbooks.example.com/dcgm-exporter-down"

        # GPU throttling
        - alert: GPUThrottling
          expr: |
            DCGM_FI_DEV_GPU_TEMP > 80
            and
            DCGM_FI_DEV_GPU_UTIL < 50
          for: 15m
          labels:
            severity: warning
            component: gpu
          annotations:
            summary: "GPU throttling detected on {{ $labels.instance }}"
            description: "GPU temperature is high ({{ $value }}°C) but utilization is low. May be thermal throttling."

    # Alert Group 4: Model Performance Alerts
    - name: model-performance
      interval: 5m
      rules:
        # Model accuracy dropped
        - alert: ModelAccuracyDropped
          expr: |
            ml_model_accuracy < 0.85
          for: 30m
          labels:
            severity: warning
            component: model-performance
          annotations:
            summary: "Model accuracy dropped for {{ $labels.model }}"
            description: "Accuracy is {{ $value | humanizePercentage }}. Below 85% threshold."
            runbook_url: "https://runbooks.example.com/model-accuracy-dropped"

        # High data drift
        - alert: HighDataDrift
          expr: |
            ml_model_drift > 0.15
          for: 1h
          labels:
            severity: warning
            component: model-performance
          annotations:
            summary: "High data drift for {{ $labels.model }}"
            description: "Drift score is {{ $value }}. Above 15% threshold. Model may need retraining."
            runbook_url: "https://runbooks.example.com/high-data-drift"

        # Low prediction confidence
        - alert: LowPredictionConfidence
          expr: |
            avg(ml_prediction_confidence) < 0.7
          for: 30m
          labels:
            severity: info
            component: model-performance
          annotations:
            summary: "Low prediction confidence for {{ $labels.model }}"
            description: "Average confidence is {{ $value | humanizePercentage }}. Model may be uncertain."

    # Alert Group 5: Cost Anomaly Alerts
    - name: cost-anomalies
      interval: 1h
      rules:
        # Unexpected cost increase
        - alert: UnexpectedCostIncrease
          expr: |
            (
              sum(container_cpu_allocation * on(node) group_left() avg(node_cpu_hourly_cost))
              /
              sum(container_cpu_allocation * on(node) group_left() avg(node_cpu_hourly_cost) offset 1d)
            ) > 1.5
          for: 3h
          labels:
            severity: warning
            component: cost
          annotations:
            summary: "Unexpected cost increase in {{ $labels.namespace }}"
            description: "Cost increased by {{ $value | humanizePercentage }} compared to yesterday."

        # Team over budget
        - alert: TeamOverBudget
          expr: |
            sum by (team) (container_cpu_allocation * on(node) group_left() avg(node_cpu_hourly_cost)) > 1000
          for: 6h
          labels:
            severity: info
            component: cost
          annotations:
            summary: "Team {{ $labels.team }} over budget"
            description: "Monthly spend is projected at ${{ $value | humanize }}. Budget is $1000."

        # Idle GPUs costing money
        - alert: IdleGPUsCostingMoney
          expr: |
            sum(DCGM_FI_DEV_GPU_UTIL < 5) * 32  # $32/hour per idle A100
          for: 4h
          labels:
            severity: warning
            component: cost
          annotations:
            summary: "{{ $value }} idle GPUs wasting money"
            description: "Idle GPUs are costing ${{ $value }} per hour. Consider scaling down."

    # Alert Group 6: Infrastructure Alerts
    - name: infrastructure
      interval: 1m
      rules:
        # Node not ready
        - alert: NodeNotReady
          expr: |
            kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 10m
          labels:
            severity: critical
            component: infrastructure
          annotations:
            summary: "Node {{ $labels.node }} not ready"
            description: "Node has been NotReady for > 10 minutes."
            runbook_url: "https://runbooks.example.com/node-not-ready"

        # High disk usage
        - alert: HighDiskUsage
          expr: |
            (
              node_filesystem_avail_bytes{mountpoint="/"}
              /
              node_filesystem_size_bytes{mountpoint="/"}
            ) < 0.1
          for: 30m
          labels:
            severity: warning
            component: infrastructure
          annotations:
            summary: "High disk usage on {{ $labels.instance }}"
            description: "Disk usage is {{ $value | humanizePercentage }}. Less than 10% free."

        # Persistent Volume almost full
        - alert: PersistentVolumeAlmostFull
          expr: |
            (
              kubelet_volume_stats_available_bytes
              /
              kubelet_volume_stats_capacity_bytes
            ) < 0.1
          for: 30m
          labels:
            severity: warning
            component: infrastructure
          annotations:
            summary: "PV {{ $labels.persistentvolumeclaim }} almost full"
            description: "Volume is {{ $value | humanizePercentage }} full. May need to expand."

---
# Alert notification templates
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-templates
  namespace: monitoring
data:
  slack.tmpl: |
    {{ define "slack.default.title" }}
    [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .GroupLabels.alertname }}
    {{ end }}

    {{ define "slack.default.text" }}
    {{ range .Alerts }}
    *Alert:* {{ .Labels.alertname }} - `{{ .Labels.severity }}`
    *Description:* {{ .Annotations.description }}
    *Details:*
    {{ range .Labels.SortedPairs }} • *{{ .Name }}:* `{{ .Value }}`
    {{ end }}
    {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ end }}
    {{ end }}
    {{ end }}

  pagerduty.tmpl: |
    {{ define "pagerduty.default.description" }}
    {{ .GroupLabels.alertname }}: {{ .Annotations.summary }}
    {{ end }}

    {{ define "pagerduty.default.details" }}
    {{ .Annotations.description }}
    Severity: {{ .Labels.severity }}
    {{ if .Annotations.runbook_url }}Runbook: {{ .Annotations.runbook_url }}{{ end }}
    {{ end }}

---
# Best Practices Summary:
#
# 1. Alert Severity Levels:
#    Critical: Production down, immediate action required
#      - Model serving down (no healthy replicas)
#      - GPU not reporting (infrastructure failure)
#      - Node not ready
#
#    Warning: Degraded performance, action within hours
#      - High error rate (> 1%)
#      - High latency (> 500ms)
#      - Training job failures
#      - GPU temperature high
#      - Model accuracy dropped
#
#    Info: Informational, no immediate action
#      - Low GPU utilization (cost optimization opportunity)
#      - Low prediction confidence
#      - Team approaching budget
#
# 2. Alert Design:
#    - Use `for: 5m` to avoid flapping (brief spikes)
#    - Include runbook URLs for common issues
#    - Descriptive summaries and descriptions
#    - Relevant labels (component, severity)
#    - Humanized values (percentages, durations)
#
# 3. Notification Routing:
#    Critical alerts:
#      - PagerDuty (wake up on-call)
#      - Slack #incidents channel
#
#    Warning alerts:
#      - Slack team channels
#      - Email to team leads
#
#    Info alerts:
#      - Slack #monitoring channel
#      - Dashboard only
#
# 4. Alert Fatigue Prevention:
#    - Use `for: <duration>` to filter transient issues
#    - Group similar alerts (batching)
#    - Silence during maintenance windows
#    - Regular alert review (disable noisy alerts)
#    - Aim for < 10 alerts per day
#
# 5. Runbook Integration:
#    - Every critical/warning alert has runbook URL
#    - Runbooks include:
#      - Symptom description
#      - Diagnostic steps
#      - Resolution steps
#      - Escalation path
#
# Real-world impact:
# - 10 second detection time (from issue to alert)
# - 95% alert accuracy (few false positives)
# - 2 minute MTTR for common issues (with runbooks)
# - < 5 alerts per day (low noise)
#
# Alert volume:
# - Production: 2-5 alerts/day (mostly warnings)
# - Development: 10-20 alerts/day (training failures)
# - Critical pages: < 1 per week (good!)
#
# Common alert causes:
# 1. High error rate:
#    - Model version change (canary rollout issue)
#    - Dependency failure (database down)
#    - Configuration error
#
# 2. Training job failure:
#    - OOM (increase memory limits)
#    - Data corruption (fix data pipeline)
#    - Code bug (revert code change)
#
# 3. GPU temperature high:
#    - Cooling failure (check datacenter)
#    - Overclocking (reduce workload)
#    - Dust buildup (physical maintenance)
#
# 4. Model accuracy dropped:
#    - Data drift (retrain model)
#    - Feature engineering change
#    - Upstream data quality issue
#
# Alerting timeline:
# - Issue occurs: 0s
# - Prometheus scrapes metric: 15s
# - Alert fires (after `for` duration): 5m 15s
# - AlertManager receives: 5m 16s
# - Notification sent (Slack/PagerDuty): 5m 20s
# - On-call receives: 5m 25s
# - Total: ~5.5 minutes from issue to notification
