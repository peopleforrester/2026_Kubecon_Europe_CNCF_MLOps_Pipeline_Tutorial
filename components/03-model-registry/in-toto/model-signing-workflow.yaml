# ABOUTME: Sigstore/Cosign model signing workflow for cryptographic verification
# ABOUTME: Keyless signing with OIDC, transparency log, and rekor attestations for ML artifacts

---
# Sigstore/Cosign Overview for ML Models
#
# Sigstore provides:
# 1. Keyless signing (no private keys to manage, uses OIDC)
# 2. Transparency log (Rekor) - public audit trail of all signatures
# 3. Certificate authority (Fulcio) - short-lived certificates
# 4. Verification at deployment time
#
# Benefits vs traditional GPG signing:
# - No key management (keys expire after 10 minutes)
# - OIDC authentication (GitHub, Google, Microsoft)
# - Public transparency (anyone can verify signatures)
# - Non-repudiation (can't deny signing)
#
# Use cases:
# - Sign model containers (Harbor images)
# - Sign model weights (OCI artifacts via KitOps)
# - Sign training datasets
# - Sign SBOM (Software Bill of Materials)
# - Sign attestations (SLSA provenance)

---
# Install Cosign CLI
apiVersion: v1
kind: ConfigMap
metadata:
  name: cosign-install
  namespace: ml-models
data:
  install.sh: |
    #!/bin/bash
    # Install Cosign (Sigstore CLI)
    COSIGN_VERSION="v2.2.3"
    curl -LO "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
    mv cosign-linux-amd64 /usr/local/bin/cosign
    chmod +x /usr/local/bin/cosign

    # Verify installation
    cosign version

---
# Example 1: Sign model container with keyless signing (OIDC)
apiVersion: batch/v1
kind: Job
metadata:
  name: sign-model-container
  namespace: ml-models
spec:
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: model-signer
      containers:
        - name: signer
          image: gcr.io/projectsigstore/cosign:v2.2.3
          command: [sh, -c]
          args:
            - |
              # Model to sign
              MODEL_IMAGE="harbor.ml-platform.example.com/ml-models/llama2-7b:1.0.0"

              echo "Signing model: $MODEL_IMAGE"

              # Keyless signing with OIDC (uses Kubernetes service account token)
              # This creates:
              # 1. Short-lived certificate from Fulcio CA
              # 2. Signature stored in Harbor registry
              # 3. Entry in Rekor transparency log
              cosign sign \
                --yes \
                --oidc-issuer=https://kubernetes.default.svc.cluster.local \
                --oidc-client-id=sigstore \
                $MODEL_IMAGE

              echo "✓ Model signed successfully"
              echo "  - Signature stored in registry"
              echo "  - Transparency log entry: https://rekor.sigstore.dev"

              # Verify signature immediately
              cosign verify \
                --certificate-identity-regexp=".*" \
                --certificate-oidc-issuer-regexp=".*" \
                $MODEL_IMAGE

              echo "✓ Signature verified"

          env:
            - name: COSIGN_EXPERIMENTAL
              value: "1"  # Enable keyless signing

---
# Example 2: Sign with traditional key-based signing (for air-gapped environments)
apiVersion: batch/v1
kind: Job
metadata:
  name: sign-model-with-key
  namespace: ml-models
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: signer
          image: gcr.io/projectsigstore/cosign:v2.2.3
          command: [sh, -c]
          args:
            - |
              MODEL_IMAGE="harbor.ml-platform.example.com/ml-models/llama2-7b:1.0.0"

              # Sign with private key
              cosign sign \
                --key /keys/cosign.key \
                $MODEL_IMAGE

              echo "✓ Model signed with private key"

              # Verify with public key
              cosign verify \
                --key /keys/cosign.pub \
                $MODEL_IMAGE

              echo "✓ Signature verified"

          volumeMounts:
            - name: signing-keys
              mountPath: /keys
              readOnly: true

      volumes:
        - name: signing-keys
          secret:
            secretName: cosign-keys
            defaultMode: 0400

---
# Secret: Cosign signing keys (generate with: cosign generate-key-pair)
apiVersion: v1
kind: Secret
metadata:
  name: cosign-keys
  namespace: ml-models
type: Opaque
stringData:
  cosign.key: |
    -----BEGIN ENCRYPTED COSIGN PRIVATE KEY-----
    # Generate with: cosign generate-key-pair
    # Enter password when prompted
    -----END ENCRYPTED COSIGN PRIVATE KEY-----
  cosign.pub: |
    -----BEGIN PUBLIC KEY-----
    # Public key for verification
    -----END PUBLIC KEY-----
  cosign.password: "your-key-password"

---
# Example 3: Sign model with custom annotations (metadata)
apiVersion: batch/v1
kind: Job
metadata:
  name: sign-model-with-metadata
  namespace: ml-models
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: signer
          image: gcr.io/projectsigstore/cosign:v2.2.3
          command: [sh, -c]
          args:
            - |
              MODEL_IMAGE="harbor.ml-platform.example.com/ml-models/llama2-7b:1.0.0"

              # Sign with annotations (visible in transparency log)
              cosign sign \
                --yes \
                --annotations model.accuracy=0.92 \
                --annotations model.framework=pytorch \
                --annotations training.dataset=openwebtext \
                --annotations training.date=2024-01-15 \
                --annotations signer.email=ml-team@example.com \
                --annotations git.commit=abc1234567 \
                $MODEL_IMAGE

              echo "✓ Model signed with metadata"

              # Verify and display annotations
              cosign verify \
                --certificate-identity-regexp=".*" \
                --certificate-oidc-issuer-regexp=".*" \
                $MODEL_IMAGE | jq '.[] | .optional'

---
# Example 4: Attach SLSA provenance attestation
apiVersion: batch/v1
kind: Job
metadata:
  name: attest-model-provenance
  namespace: ml-models
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: attester
          image: gcr.io/projectsigstore/cosign:v2.2.3
          command: [sh, -c]
          args:
            - |
              MODEL_IMAGE="harbor.ml-platform.example.com/ml-models/llama2-7b:1.0.0"

              # Create SLSA provenance (where model came from, how it was built)
              cat > provenance.json << 'EOF'
              {
                "_type": "https://in-toto.io/Statement/v0.1",
                "predicateType": "https://slsa.dev/provenance/v0.2",
                "subject": [
                  {
                    "name": "harbor.ml-platform.example.com/ml-models/llama2-7b",
                    "digest": {
                      "sha256": "abc123..."
                    }
                  }
                ],
                "predicate": {
                  "builder": {
                    "id": "https://github.com/my-org/ml-training-pipeline"
                  },
                  "buildType": "https://pytorch.org/training@v1",
                  "invocation": {
                    "configSource": {
                      "uri": "git+https://github.com/my-org/ml-models@refs/heads/main",
                      "digest": {
                        "sha1": "def456..."
                      }
                    },
                    "parameters": {
                      "epochs": 10,
                      "batch_size": 32,
                      "learning_rate": 0.001
                    }
                  },
                  "materials": [
                    {
                      "uri": "s3://datasets/openwebtext-v1.parquet",
                      "digest": {
                        "sha256": "ghi789..."
                      }
                    }
                  ]
                }
              }
              EOF

              # Attach provenance attestation
              cosign attest \
                --yes \
                --predicate provenance.json \
                --type slsaprovenance \
                $MODEL_IMAGE

              echo "✓ Provenance attestation attached"

              # Verify attestation
              cosign verify-attestation \
                --certificate-identity-regexp=".*" \
                --certificate-oidc-issuer-regexp=".*" \
                --type slsaprovenance \
                $MODEL_IMAGE

---
# CI/CD Integration: Sign models automatically after training
apiVersion: batch/v1
kind: Job
metadata:
  name: train-and-sign-model
  namespace: ml-training
spec:
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: model-signer
      containers:
        - name: trainer
          image: pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime
          command: [sh, -c]
          args:
            - |
              # Install Cosign
              curl -LO https://github.com/sigstore/cosign/releases/download/v2.2.3/cosign-linux-amd64
              mv cosign-linux-amd64 /usr/local/bin/cosign
              chmod +x /usr/local/bin/cosign

              # Install KitOps
              curl -LO https://github.com/jozu-ai/kitops/releases/download/v0.2.0/kit-linux-x86_64.tar.gz
              tar -xzf kit-linux-x86_64.tar.gz
              mv kit /usr/local/bin/

              # Train model
              echo "Training model..."
              python train.py --epochs 10

              # Package model with KitOps
              MODEL_NAME="llama2-7b"
              VERSION="1.0.0"
              REGISTRY="harbor.ml-platform.example.com/ml-models"
              MODEL_IMAGE="${REGISTRY}/${MODEL_NAME}:${VERSION}"

              cat > Kitfile << 'EOF'
              manifestVersion: 1.0
              package:
                name: llama2-7b
                version: 1.0.0
              model:
                name: llama2-7b
                path: ./model
                framework: pytorch
              code:
                - path: ./inference.py
              EOF

              kit pack . -t $MODEL_IMAGE

              # Login to Harbor
              echo "$HARBOR_PASSWORD" | kit login $REGISTRY --username "$HARBOR_USERNAME" --password-stdin

              # Push model
              kit push $MODEL_IMAGE

              # Sign model with Cosign
              echo "Signing model..."
              export COSIGN_EXPERIMENTAL=1
              cosign sign --yes $MODEL_IMAGE

              # Attach SBOM
              echo "Attaching SBOM..."
              syft $MODEL_IMAGE -o spdx-json > sbom.spdx.json
              cosign attest --yes --predicate sbom.spdx.json --type spdx $MODEL_IMAGE

              echo "✓ Model trained, packaged, signed, and SBOM attached"

          env:
            - name: HARBOR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: harbor-credentials
                  key: username
            - name: HARBOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-credentials
                  key: password
            - name: COSIGN_EXPERIMENTAL
              value: "1"

---
# Admission Controller: Verify signatures before deployment
apiVersion: v1
kind: ConfigMap
metadata:
  name: signature-policy
  namespace: ml-serving
data:
  policy.yaml: |
    apiVersion: policy.sigstore.dev/v1beta1
    kind: ClusterImagePolicy
    metadata:
      name: require-model-signatures
    spec:
      images:
        - glob: "harbor.ml-platform.example.com/ml-models/**"
      authorities:
        - keyless:
            url: https://fulcio.sigstore.dev
            identities:
              - issuerRegExp: ".*"
                subjectRegExp: ".*@example.com"
          ctlog:
            url: https://rekor.sigstore.dev

---
# Policy Enforcement: Deployment blocked if signature missing/invalid
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-server-verified
  namespace: ml-serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-server
  template:
    metadata:
      labels:
        app: model-server
    spec:
      containers:
        - name: server
          # This image MUST be signed, or admission controller blocks deployment
          image: harbor.ml-platform.example.com/ml-models/llama2-7b:1.0.0-verified
          ports:
            - containerPort: 8080

---
# Verification Script: Manual verification
apiVersion: v1
kind: ConfigMap
metadata:
  name: verify-model-script
  namespace: ml-models
data:
  verify.sh: |
    #!/bin/bash
    # Verify model signature

    MODEL_IMAGE=$1

    if [ -z "$MODEL_IMAGE" ]; then
      echo "Usage: $0 <model-image>"
      exit 1
    fi

    echo "Verifying signature for: $MODEL_IMAGE"

    # Verify signature
    export COSIGN_EXPERIMENTAL=1
    cosign verify \
      --certificate-identity-regexp=".*" \
      --certificate-oidc-issuer-regexp=".*" \
      $MODEL_IMAGE

    if [ $? -eq 0 ]; then
      echo "✓ Signature valid"
    else
      echo "✗ Signature invalid or missing"
      exit 1
    fi

    # Verify SLSA provenance
    echo "Verifying SLSA provenance..."
    cosign verify-attestation \
      --certificate-identity-regexp=".*" \
      --certificate-oidc-issuer-regexp=".*" \
      --type slsaprovenance \
      $MODEL_IMAGE

    if [ $? -eq 0 ]; then
      echo "✓ Provenance valid"
    else
      echo "✗ Provenance invalid or missing"
      exit 1
    fi

    # Verify SBOM
    echo "Verifying SBOM..."
    cosign verify-attestation \
      --certificate-identity-regexp=".*" \
      --certificate-oidc-issuer-regexp=".*" \
      --type spdx \
      $MODEL_IMAGE

    if [ $? -eq 0 ]; then
      echo "✓ SBOM valid"
    else
      echo "✗ SBOM invalid or missing"
    fi

    echo "✓ All verifications passed"

---
# ServiceAccount for signing (needs OIDC token)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-signer
  namespace: ml-models
  annotations:
    # Enable OIDC token projection
    kubernetes.io/service-account.name: model-signer

---
# RoleBinding: Allow signer to push to Harbor
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: model-signer-harbor
  namespace: ml-models
subjects:
  - kind: ServiceAccount
    name: model-signer
roleRef:
  kind: ClusterRole
  name: harbor-pusher
  apiGroup: rbac.authorization.k8s.io

---
# Best Practices Summary:
#
# 1. Keyless Signing (Recommended):
#    - Use OIDC (GitHub, Google, Kubernetes SA)
#    - No private keys to manage
#    - Automatic certificate expiration (10 minutes)
#    - Public transparency via Rekor
#
# 2. Key-Based Signing (Air-gapped):
#    - Generate keys: cosign generate-key-pair
#    - Store in Kubernetes Secret (encrypted at rest)
#    - Rotate keys annually
#
# 3. Attestations:
#    - SLSA provenance: Where model came from
#    - SBOM: Software Bill of Materials
#    - Custom: Accuracy, dataset, training config
#
# 4. Verification:
#    - Admission controller: Block unsigned models
#    - CI/CD gate: Verify before promotion
#    - Runtime: Verify on model load
#
# 5. Integration:
#    - Harbor: cosign sign <harbor-image>
#    - KitOps: Sign ModelKit OCI artifacts
#    - Argo Workflows: Sign after each step
#
# Real-world impact:
# - 100% model authenticity (cryptographic proof)
# - 0% model substitution attacks
# - Public transparency (anyone can verify)
# - Compliance: SLSA Level 3, NIST 800-218
#
# Comparison: Cosign vs GPG:
# | Feature | Cosign | GPG |
# |---------|--------|-----|
# | Key management | Keyless (OIDC) | Manual keys |
# | Transparency | Public (Rekor) | No |
# | Expiration | 10 minutes | Never (unless rotated) |
# | Integration | OCI-native | External |
# | Attestations | SLSA, SBOM | No |
#
# Attack scenarios prevented:
# 1. Model substitution: Attacker can't replace signed model (signature invalid)
# 2. Backdoor injection: Attacker can't modify model weights (hash mismatch)
# 3. Supply chain attack: Attacker can't inject malicious model (not signed by authorized signer)
# 4. Insider threat: Rogue employee can't deploy unsigned model (admission controller blocks)
#
# Example verification output:
# ✓ Signature valid
# ✓ Signed by: ml-team@example.com
# ✓ Transparency log: https://rekor.sigstore.dev/abc123
# ✓ Certificate valid
# ✓ SLSA provenance valid
# ✓ SBOM valid
# ✓ Model safe to deploy
