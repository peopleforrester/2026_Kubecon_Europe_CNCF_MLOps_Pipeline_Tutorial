# ABOUTME: Software Bill of Materials (SBOM) generation for ML models and containers
# ABOUTME: Tracks dependencies, licenses, vulnerabilities for supply chain transparency and compliance
#
# ⚠️ SECURITY NOTE: This file contains curl | sh commands for tool installation
# For production deployments, download and verify scripts before execution:
#   curl -sSfL https://url/install.sh -o /tmp/install.sh
#   # Review script contents
#   less /tmp/install.sh
#   # Verify checksum (obtain from official source)
#   sha256sum /tmp/install.sh
#   # Then execute
#   sh /tmp/install.sh

---
# SBOM Overview for ML Models
#
# An SBOM (Software Bill of Materials) lists all components in a model artifact:
# 1. Python packages (PyTorch, NumPy, transformers)
# 2. System libraries (CUDA, cuDNN, OpenSSL)
# 3. Model files (weights, configs, tokenizers)
# 4. Training datasets (name, version, license)
# 5. Licenses (Apache 2.0, MIT, GPL)
# 6. Vulnerabilities (CVEs in dependencies)
#
# Why SBOMs matter for ML:
# - Security: Identify vulnerable dependencies (Log4j, OpenSSL)
# - Compliance: Prove no GPL code in commercial models
# - Licensing: Track dataset licenses (CC-BY, MIT, proprietary)
# - Transparency: Know what's inside a "black box" model
# - Incident response: Rapidly identify affected models (CVE-2024-XXXX)
#
# Standards:
# - SPDX (Software Package Data Exchange) - Linux Foundation
# - CycloneDX - OWASP
# - SWID (Software Identification) - ISO/IEC 19770-2
#
# Tools:
# - Syft (Anchore) - Generate SBOMs from containers
# - Grype (Anchore) - Scan SBOMs for vulnerabilities
# - Trivy (Aqua Security) - SBOM + vulnerability scanning

---
# Install Syft (SBOM generator)
apiVersion: v1
kind: ConfigMap
metadata:
  name: syft-install
  namespace: ml-models
data:
  install.sh: |
    #!/bin/bash
    # Install Syft (Anchore SBOM generator)
    SYFT_VERSION="v1.0.1"
    # ⚠️ SECURITY: See file header for production-safe installation method
    curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin $SYFT_VERSION

    # Verify installation
    syft version

---
# Example 1: Generate SBOM for model container
apiVersion: batch/v1
kind: Job
metadata:
  name: generate-sbom-container
  namespace: ml-models
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: sbom-generator
          image: anchore/syft:latest
          command: [sh, -c]
          args:
            - |
              MODEL_IMAGE="harbor.ml-platform.example.com/ml-models/llama2-7b:1.0.0"

              echo "Generating SBOM for: $MODEL_IMAGE"

              # Generate SBOM in SPDX JSON format
              syft $MODEL_IMAGE -o spdx-json > sbom.spdx.json

              echo "✓ SBOM generated"
              echo "  - Format: SPDX 2.3 JSON"
              echo "  - Size: $(wc -c < sbom.spdx.json) bytes"

              # Preview SBOM
              echo "=== SBOM Summary ==="
              syft $MODEL_IMAGE -o table

              # Upload to S3
              # aws s3 cp sbom.spdx.json s3://ml-sboms/llama2-7b/1.0.0/sbom.spdx.json

---
# Example 2: Generate SBOM with multiple formats
apiVersion: batch/v1
kind: Job
metadata:
  name: generate-sbom-all-formats
  namespace: ml-models
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: sbom-generator
          image: anchore/syft:latest
          command: [sh, -c]
          args:
            - |
              MODEL_IMAGE="harbor.ml-platform.example.com/ml-models/llama2-7b:1.0.0"

              echo "Generating SBOM in multiple formats..."

              # SPDX JSON (most detailed)
              syft $MODEL_IMAGE -o spdx-json > sbom.spdx.json
              echo "✓ SPDX JSON: $(wc -l < sbom.spdx.json) lines"

              # CycloneDX JSON (OWASP standard)
              syft $MODEL_IMAGE -o cyclonedx-json > sbom.cyclonedx.json
              echo "✓ CycloneDX JSON: $(wc -l < sbom.cyclonedx.json) lines"

              # SPDX Tag-Value (human-readable)
              syft $MODEL_IMAGE -o spdx-tag-value > sbom.spdx.txt
              echo "✓ SPDX Tag-Value: $(wc -l < sbom.spdx.txt) lines"

              # Syft JSON (Anchore format)
              syft $MODEL_IMAGE -o syft-json > sbom.syft.json
              echo "✓ Syft JSON: $(wc -l < sbom.syft.json) lines"

              # Human-readable table
              syft $MODEL_IMAGE -o table > sbom.txt
              echo "✓ Table: $(wc -l < sbom.txt) lines"

              ls -lh sbom.*

---
# Example 3: SBOM with vulnerability scanning
apiVersion: batch/v1
kind: Job
metadata:
  name: sbom-with-vulnerabilities
  namespace: ml-models
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: scanner
          image: anchore/grype:latest
          command: [sh, -c]
          args:
            - |
              MODEL_IMAGE="harbor.ml-platform.example.com/ml-models/llama2-7b:1.0.0"

              # Install Syft (Grype container doesn't include it)
              # ⚠️ SECURITY: For production, pre-install in custom image
              curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

              echo "Generating SBOM and scanning for vulnerabilities..."

              # Generate SBOM
              syft $MODEL_IMAGE -o spdx-json > sbom.spdx.json

              # Scan SBOM for vulnerabilities with Grype
              grype sbom:sbom.spdx.json -o table

              echo ""
              echo "=== Vulnerability Summary ==="
              grype sbom:sbom.spdx.json -o json | jq '.matches | group_by(.vulnerability.severity) | map({severity: .[0].vulnerability.severity, count: length})'

              # Fail if critical vulnerabilities found
              CRITICAL_COUNT=$(grype sbom:sbom.spdx.json -o json | jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length')

              if [ "$CRITICAL_COUNT" -gt 0 ]; then
                echo "✗ Found $CRITICAL_COUNT critical vulnerabilities"
                echo "  Block deployment until patched"
                exit 1
              else
                echo "✓ No critical vulnerabilities"
              fi

---
# Example 4: Attach SBOM to model with Cosign
apiVersion: batch/v1
kind: Job
metadata:
  name: attach-sbom-to-model
  namespace: ml-models
spec:
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: model-signer
      containers:
        - name: attacher
          image: gcr.io/projectsigstore/cosign:v2.2.3
          command: [sh, -c]
          args:
            - |
              # Install Syft
              # ⚠️ SECURITY: See file header for production-safe installation method
              curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

              MODEL_IMAGE="harbor.ml-platform.example.com/ml-models/llama2-7b:1.0.0"

              echo "Generating SBOM..."
              syft $MODEL_IMAGE -o spdx-json > sbom.spdx.json

              echo "Attaching SBOM to model as attestation..."
              export COSIGN_EXPERIMENTAL=1
              cosign attest \
                --yes \
                --predicate sbom.spdx.json \
                --type spdx \
                $MODEL_IMAGE

              echo "✓ SBOM attached to model"

              # Verify SBOM attestation
              echo "Verifying SBOM attestation..."
              cosign verify-attestation \
                --certificate-identity-regexp=".*" \
                --certificate-oidc-issuer-regexp=".*" \
                --type spdx \
                $MODEL_IMAGE | jq .

              echo "✓ SBOM verified"

---
# Example 5: CI/CD integration - Generate SBOM during build
apiVersion: batch/v1
kind: Job
metadata:
  name: build-model-with-sbom
  namespace: ml-models
spec:
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: model-signer
      containers:
        - name: builder
          image: pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime
          command: [sh, -c]
          args:
            - |
              # Install tools
              # ⚠️ SECURITY: See file header for production-safe installation method
              curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
              curl -LO https://github.com/sigstore/cosign/releases/download/v2.2.3/cosign-linux-amd64
              mv cosign-linux-amd64 /usr/local/bin/cosign
              chmod +x /usr/local/bin/cosign
              curl -LO https://github.com/jozu-ai/kitops/releases/download/v0.2.0/kit-linux-x86_64.tar.gz
              tar -xzf kit-linux-x86_64.tar.gz
              mv kit /usr/local/bin/

              # Build model (simulate)
              echo "Training model..."
              mkdir -p model
              echo "model weights" > model/weights.pth

              # Create Kitfile
              cat > Kitfile << 'EOF'
              manifestVersion: 1.0
              package:
                name: llama2-7b
                version: 1.0.0
              model:
                name: llama2-7b
                path: ./model
                framework: pytorch
              EOF

              # Package model
              MODEL_IMAGE="harbor.ml-platform.example.com/ml-models/llama2-7b:1.0.0"
              kit pack . -t $MODEL_IMAGE

              # Push to Harbor
              echo "$HARBOR_PASSWORD" | kit login harbor.ml-platform.example.com --username "$HARBOR_USERNAME" --password-stdin
              kit push $MODEL_IMAGE

              # Generate SBOM
              echo "Generating SBOM..."
              syft $MODEL_IMAGE -o spdx-json > sbom.spdx.json

              # Attach SBOM as attestation
              export COSIGN_EXPERIMENTAL=1
              cosign attest --yes --predicate sbom.spdx.json --type spdx $MODEL_IMAGE

              # Sign model
              cosign sign --yes $MODEL_IMAGE

              echo "✓ Model built, pushed, SBOM attached, and signed"

          env:
            - name: HARBOR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: harbor-credentials
                  key: username
            - name: HARBOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-credentials
                  key: password
            - name: COSIGN_EXPERIMENTAL
              value: "1"

---
