---
# SBOM Policy: Require SBOM for all models
apiVersion: v1
kind: ConfigMap
metadata:
  name: sbom-policy
  namespace: ml-serving
data:
  policy.rego: |
    package kubernetes.admission

    import future.keywords.if

    # Deny deployment if model lacks SBOM attestation
    deny[msg] if {
      input.request.kind.kind == "Deployment"
      input.request.namespace == "ml-serving"

      container := input.request.object.spec.template.spec.containers[_]
      image := container.image

      not has_sbom(image)

      msg := sprintf("Model %s does not have SBOM attestation", [image])
    }

    # Check if model has SBOM (simplified - real check uses Cosign)
    has_sbom(image) if {
      # Query SBOM store or use Cosign to verify
      # For demo: require "-sbom" suffix
      contains(image, "-sbom")
    }

---
# Query SBOM API
apiVersion: v1
kind: Service
metadata:
  name: sbom-api
  namespace: ml-models
spec:
  selector:
    app: sbom-api
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbom-api
  namespace: ml-models
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sbom-api
  template:
    metadata:
      labels:
        app: sbom-api
    spec:
      containers:
        - name: api
          image: python:3.11-slim
          command: [sh, -c]
          args:
            - |
              pip install -q flask

              cat > api.py << 'EOF'
              from flask import Flask, jsonify, request
              import json

              app = Flask(__name__)

              # Demo SBOM store (in production, query S3 or database)
              sboms = {
                  "llama2-7b:1.0.0": {
                      "packages": [
                          {"name": "torch", "version": "2.1.0", "license": "BSD-3-Clause"},
                          {"name": "transformers", "version": "4.30.0", "license": "Apache-2.0"},
                          {"name": "numpy", "version": "1.24.3", "license": "BSD-3-Clause"}
                      ],
                      "vulnerabilities": []
                  }
              }

              @app.route('/sbom/<model_name>/<version>')
              def get_sbom(model_name, version):
                  """Get SBOM for specific model"""
                  key = f"{model_name}:{version}"
                  if key in sboms:
                      return jsonify(sboms[key])
                  return jsonify({"error": "SBOM not found"}), 404

              @app.route('/sbom/<model_name>/<version>/vulnerabilities')
              def get_vulnerabilities(model_name, version):
                  """Get vulnerabilities for specific model"""
                  key = f"{model_name}:{version}"
                  if key in sboms:
                      return jsonify(sboms[key]["vulnerabilities"])
                  return jsonify({"error": "SBOM not found"}), 404

              @app.route('/sbom/<model_name>/<version>/licenses')
              def get_licenses(model_name, version):
                  """Get licenses for specific model"""
                  key = f"{model_name}:{version}"
                  if key in sboms:
                      licenses = [{"name": pkg["name"], "license": pkg["license"]} for pkg in sboms[key]["packages"]]
                      return jsonify(licenses)
                  return jsonify({"error": "SBOM not found"}), 404

              if __name__ == '__main__':
                  app.run(host='0.0.0.0', port=8080)
              EOF

              python api.py

          ports:
            - containerPort: 8080

---
# SBOM query examples
apiVersion: v1
kind: ConfigMap
metadata:
  name: sbom-query-examples
  namespace: ml-models
data:
  query.sh: |
    #!/bin/bash
    API_URL="http://sbom-api:8080"

    # Get full SBOM
    curl "$API_URL/sbom/llama2-7b/1.0.0" | jq .

    # Get vulnerabilities
    curl "$API_URL/sbom/llama2-7b/1.0.0/vulnerabilities" | jq .

    # Get licenses
    curl "$API_URL/sbom/llama2-7b/1.0.0/licenses" | jq .

    # Check for GPL licenses (potential compliance issue)
    curl "$API_URL/sbom/llama2-7b/1.0.0/licenses" | jq '.[] | select(.license | contains("GPL"))'

---
# Best Practices Summary:
#
# 1. Generation:
#    - Generate during CI/CD build (automated)
#    - Use Syft for containers, custom script for models
#    - Include all dependencies (Python packages, system libraries, datasets)
#
# 2. Formats:
#    - SPDX (most detailed, Linux Foundation standard)
#    - CycloneDX (OWASP standard, good for vulnerabilities)
#    - Choose based on tooling ecosystem
#
# 3. Storage:
#    - Attach to model artifact (Cosign attestation)
#    - Store in S3 (s3://ml-sboms/model/version/sbom.json)
#    - Index in database (PostgreSQL for querying)
#
# 4. Scanning:
#    - Scan SBOM for vulnerabilities (Grype, Trivy)
#    - Block deployment if critical CVEs found
#    - Alert on new vulnerabilities (CVE feeds)
#
# 5. Compliance:
#    - License checking (no GPL in commercial models)
#    - Export control (CUDA, encryption libraries)
#    - Privacy (dataset licenses)
#
# Real-world impact:
# - 100% dependency visibility
# - 0% "what's in this model?" questions
# - Rapid incident response (find all models with Log4j)
# - License compliance (no GPL violations)
#
# Example queries:
# - "Which models use PyTorch 2.0.0?" (vulnerable version)
# - "Find all models with GPL dependencies"
# - "What models are affected by CVE-2024-12345?"
# - "List all CUDA versions in production"
#
# Incident response:
# 1. CVE-2024-12345 announced for PyTorch < 2.1.1
# 2. Query SBOM database: SELECT model FROM sboms WHERE package='torch' AND version < '2.1.1'
# 3. Results: llama2-7b:1.0.0, gpt-neo:2.0.0, resnet50:3.1.0
# 4. Rebuild and redeploy affected models
# 5. Total time: 30 minutes (vs 3 days without SBOM)
#
# License compliance:
# Q: Can we deploy this model commercially?
# A: Check SBOM... Yes, all dependencies are BSD-3-Clause or Apache-2.0
#
# Q: Are there any export-controlled components?
# A: Check SBOM... Yes, CUDA 12.1 (NVIDIA proprietary, export-controlled)
