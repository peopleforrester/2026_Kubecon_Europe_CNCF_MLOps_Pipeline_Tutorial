---
# Query provenance API
apiVersion: v1
kind: Service
metadata:
  name: provenance-api
  namespace: ml-models
spec:
  selector:
    app: provenance-api
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provenance-api
  namespace: ml-models
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provenance-api
  template:
    metadata:
      labels:
        app: provenance-api
    spec:
      containers:
        - name: api
          image: python:3.11-slim
          command: [sh, -c]
          args:
            - |
              pip install -q flask kubernetes

              cat > api.py << 'EOF'
              from flask import Flask, jsonify, request
              from kubernetes import client, config
              import json

              app = Flask(__name__)
              config.load_incluster_config()
              v1 = client.CoreV1Api()

              @app.route('/provenance/<model_name>/<version>')
              def get_provenance(model_name, version):
                  """Get provenance for specific model version"""
                  cm_name = f"{model_name}-provenance"
                  try:
                      cm = v1.read_namespaced_config_map(cm_name, "ml-models")
                      provenance = json.loads(cm.data["provenance.json"])
                      return jsonify(provenance)
                  except:
                      return jsonify({"error": "Provenance not found"}), 404

              @app.route('/provenance/search')
              def search_provenance():
                  """Search provenance by criteria"""
                  # Example: /provenance/search?trainer=alice@example.com&min_accuracy=0.90
                  trainer = request.args.get('trainer')
                  min_accuracy = float(request.args.get('min_accuracy', 0))

                  cms = v1.list_namespaced_config_map("ml-models", label_selector="model.name")
                  results = []

                  for cm in cms.items:
                      if "provenance.json" in cm.data:
                          provenance = json.loads(cm.data["provenance.json"])

                          # Filter by trainer
                          if trainer and provenance["training"]["trainer"] != trainer:
                              continue

                          # Filter by accuracy
                          if provenance["results"]["metrics"]["accuracy"] < min_accuracy:
                              continue

                          results.append(provenance)

                  return jsonify(results)

              if __name__ == '__main__':
                  app.run(host='0.0.0.0', port=8080)
              EOF

              python api.py

          ports:
            - containerPort: 8080

---
# Query examples
apiVersion: v1
kind: ConfigMap
metadata:
  name: provenance-query-examples
  namespace: ml-models
data:
  query.sh: |
    #!/bin/bash
    # Query provenance API

    API_URL="http://provenance-api:8080"

    # Get provenance for specific model
    curl "$API_URL/provenance/llama2-7b/1.0.0" | jq .

    # Search models by trainer
    curl "$API_URL/provenance/search?trainer=alice@example.com" | jq .

    # Search models with accuracy > 90%
    curl "$API_URL/provenance/search?min_accuracy=0.90" | jq .

    # Get training hyperparameters
    curl "$API_URL/provenance/llama2-7b/1.0.0" | jq '.training.hyperparameters'

    # Get dataset used for training
    curl "$API_URL/provenance/llama2-7b/1.0.0" | jq '.data.training_dataset'

    # Get git commit
    curl "$API_URL/provenance/llama2-7b/1.0.0" | jq '.code.commit'

