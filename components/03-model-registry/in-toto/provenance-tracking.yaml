# ABOUTME: Model lineage and provenance tracking for complete ML pipeline audit trails
# ABOUTME: Tracks data sources, training configs, hyperparameters, and artifacts for reproducibility

---
# Provenance Tracking Overview
#
# ML model provenance answers:
# 1. What data was used for training? (dataset name, version, SHA256)
# 2. What code was used? (git commit, repository, branch)
# 3. What hyperparameters? (learning rate, batch size, epochs)
# 4. What infrastructure? (GPU type, PyTorch version, CUDA version)
# 5. Who trained it? (user, timestamp, organization)
# 6. What was the result? (accuracy, loss, F1 score)
#
# Why this matters:
# - Reproducibility: Re-create exact model from provenance
# - Debugging: Trace accuracy regression to specific data change
# - Compliance: Prove model training meets regulations (GDPR, CCPA)
# - Audit: Answer "why did model make this prediction?"
#
# Standards:
# - SLSA (Supply-chain Levels for Software Artifacts)
# - in-toto (supply chain security)
# - ML-BOM (Machine Learning Bill of Materials)

---
# Provenance Schema: Complete training metadata
apiVersion: v1
kind: ConfigMap
metadata:
  name: provenance-schema
  namespace: ml-models
data:
  schema.json: |
    {
      "$schema": "http://json-schema.org/draft-07/schema#",
      "title": "ML Model Provenance",
      "type": "object",
      "required": ["model", "training", "data", "code", "infrastructure", "results"],
      "properties": {
        "model": {
          "type": "object",
          "properties": {
            "name": {"type": "string"},
            "version": {"type": "string"},
            "framework": {"type": "string"},
            "architecture": {"type": "string"},
            "task": {"type": "string"},
            "sha256": {"type": "string"}
          }
        },
        "training": {
          "type": "object",
          "properties": {
            "start_time": {"type": "string", "format": "date-time"},
            "end_time": {"type": "string", "format": "date-time"},
            "duration_seconds": {"type": "number"},
            "hyperparameters": {
              "type": "object",
              "properties": {
                "learning_rate": {"type": "number"},
                "batch_size": {"type": "integer"},
                "epochs": {"type": "integer"},
                "optimizer": {"type": "string"}
              }
            },
            "trainer": {"type": "string"},
            "organization": {"type": "string"}
          }
        },
        "data": {
          "type": "object",
          "properties": {
            "training_dataset": {
              "type": "object",
              "properties": {
                "name": {"type": "string"},
                "version": {"type": "string"},
                "uri": {"type": "string"},
                "sha256": {"type": "string"},
                "size_bytes": {"type": "integer"},
                "num_samples": {"type": "integer"}
              }
            },
            "validation_dataset": {
              "type": "object",
              "properties": {
                "name": {"type": "string"},
                "version": {"type": "string"},
                "uri": {"type": "string"},
                "sha256": {"type": "string"}
              }
            }
          }
        },
        "code": {
          "type": "object",
          "properties": {
            "repository": {"type": "string"},
            "commit": {"type": "string"},
            "branch": {"type": "string"},
            "tag": {"type": "string"},
            "training_script": {"type": "string"}
          }
        },
        "infrastructure": {
          "type": "object",
          "properties": {
            "gpu_type": {"type": "string"},
            "num_gpus": {"type": "integer"},
            "pytorch_version": {"type": "string"},
            "cuda_version": {"type": "string"},
            "python_version": {"type": "string"},
            "os": {"type": "string"}
          }
        },
        "results": {
          "type": "object",
          "properties": {
            "metrics": {
              "type": "object",
              "properties": {
                "accuracy": {"type": "number"},
                "loss": {"type": "number"},
                "f1_score": {"type": "number"}
              }
            },
            "artifacts": {
              "type": "array",
              "items": {
                "type": "object",
                "properties": {
                  "name": {"type": "string"},
                  "uri": {"type": "string"},
                  "sha256": {"type": "string"}
                }
              }
            }
          }
        }
      }
    }

---
# Example: Capture provenance during training
apiVersion: batch/v1
kind: Job
metadata:
  name: train-with-provenance
  namespace: ml-training
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime
          command: [sh, -c]
          args:
            - |
              pip install -q gitpython

              cat > train_with_provenance.py << 'EOF'
              import torch
              import json
              import hashlib
              import os
              from datetime import datetime
              import git

              # Training configuration
              LEARNING_RATE = 0.001
              BATCH_SIZE = 32
              EPOCHS = 10

              # Capture provenance
              provenance = {
                  "model": {
                      "name": "llama2-7b",
                      "version": "1.0.0",
                      "framework": "pytorch",
                      "architecture": "llama2",
                      "task": "text-generation"
                  },
                  "training": {
                      "start_time": datetime.utcnow().isoformat() + "Z",
                      "hyperparameters": {
                          "learning_rate": LEARNING_RATE,
                          "batch_size": BATCH_SIZE,
                          "epochs": EPOCHS,
                          "optimizer": "adam"
                      },
                      "trainer": os.environ.get("USER", "unknown"),
                      "organization": "example-ml-team"
                  },
                  "data": {
                      "training_dataset": {
                          "name": "openwebtext",
                          "version": "1.0",
                          "uri": "s3://datasets/openwebtext-v1.parquet",
                          "sha256": "abc123...",  # Compute actual hash
                          "num_samples": 1000000
                      }
                  },
                  "code": {
                      "repository": "https://github.com/my-org/ml-models",
                      "commit": "abc1234567",  # Get from git
                      "branch": "main",
                      "training_script": "train.py"
                  },
                  "infrastructure": {
                      "gpu_type": os.environ.get("GPU_TYPE", "A100"),
                      "num_gpus": torch.cuda.device_count(),
                      "pytorch_version": torch.__version__,
                      "cuda_version": torch.version.cuda,
                      "python_version": "3.11",
                      "os": "Ubuntu 22.04"
                  }
              }

              # Simulate training
              model = torch.nn.Linear(100, 10)
              print(f"Training with learning_rate={LEARNING_RATE}, batch_size={BATCH_SIZE}, epochs={EPOCHS}")

              # Simulate metrics
              final_accuracy = 0.92
              final_loss = 0.15

              # Save model
              model_path = "model/weights.pth"
              os.makedirs("model", exist_ok=True)
              torch.save(model.state_dict(), model_path)

              # Compute model SHA256
              with open(model_path, "rb") as f:
                  model_sha256 = hashlib.sha256(f.read()).hexdigest()

              provenance["model"]["sha256"] = model_sha256

              # Capture results
              provenance["training"]["end_time"] = datetime.utcnow().isoformat() + "Z"
              provenance["training"]["duration_seconds"] = 3600  # 1 hour

              provenance["results"] = {
                  "metrics": {
                      "accuracy": final_accuracy,
                      "loss": final_loss,
                      "f1_score": 0.91
                  },
                  "artifacts": [
                      {
                          "name": "model_weights",
                          "uri": f"harbor.ml-platform.example.com/ml-models/llama2-7b:1.0.0",
                          "sha256": model_sha256
                      }
                  ]
              }

              # Save provenance
              with open("provenance.json", "w") as f:
                  json.dump(provenance, f, indent=2)

              print("✓ Training complete")
              print(f"  - Accuracy: {final_accuracy}")
              print(f"  - Model SHA256: {model_sha256}")
              print(f"  - Provenance saved to provenance.json")

              # Upload provenance to S3
              # aws s3 cp provenance.json s3://ml-provenance/llama2-7b/1.0.0/provenance.json
              EOF

              python train_with_provenance.py

              # Display provenance
              echo "=== Provenance ==="
              cat provenance.json

          resources:
            limits:
              nvidia.com/gpu: "1"

