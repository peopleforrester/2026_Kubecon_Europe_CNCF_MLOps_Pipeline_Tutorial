---
# Provenance Visualization
apiVersion: v1
kind: ConfigMap
metadata:
  name: provenance-visualization
  namespace: ml-models
data:
  visualize.py: |
    #!/usr/bin/env python3
    # Generate provenance graph with Graphviz

    import json
    import sys

    provenance_file = sys.argv[1] if len(sys.argv) > 1 else "provenance.json"

    with open(provenance_file) as f:
        prov = json.load(f)

    print("digraph ModelProvenance {")
    print('  rankdir=LR;')
    print('  node [shape=box];')

    # Dataset node
    dataset = prov["data"]["training_dataset"]["name"]
    print(f'  "{dataset}" [label="{dataset}\\n{prov["data"]["training_dataset"]["num_samples"]} samples"];')

    # Code node
    code = f"Code\\n{prov['code']['commit'][:7]}"
    print(f'  "{code}" [label="{code}"];')

    # Model node
    model = f"{prov['model']['name']}\\nv{prov['model']['version']}"
    print(f'  "{model}" [label="{model}\\nAccuracy: {prov["results"]["metrics"]["accuracy"]}", style=filled, fillcolor=lightgreen];')

    # Edges
    print(f'  "{dataset}" -> "{model}";')
    print(f'  "{code}" -> "{model}";')

    print("}")

---
# Best Practices Summary:
#
# 1. Capture Everything:
#    - Data: dataset name, version, SHA256, num samples
#    - Code: git commit, repository, branch
#    - Hyperparameters: learning rate, batch size, epochs
#    - Infrastructure: GPU type, PyTorch version, CUDA
#    - Results: accuracy, loss, artifacts
#
# 2. Storage:
#    - ConfigMap: Small provenance (< 1MB)
#    - S3: Large provenance, training logs
#    - Database: Queryable provenance (PostgreSQL)
#
# 3. Standards:
#    - SLSA provenance format
#    - in-toto link metadata
#    - ML-BOM (ML Bill of Materials)
#
# 4. Automation:
#    - Capture during training (not manual)
#    - Attach to model artifact (OCI image labels)
#    - Sign with Cosign (tamper-proof)
#
# 5. Querying:
#    - API: Query by trainer, accuracy, date
#    - CLI: kubectl get cm -l model.name=llama2-7b
#    - UI: Model registry (Harbor, MLflow)
#
# Real-world impact:
# - 100% model reproducibility
# - 0% "I don't know how this was trained"
# - Instant debugging (trace accuracy drop to data change)
# - Compliance: GDPR Article 22 (right to explanation)
#
# Example queries:
# - "Show all models trained by alice@example.com"
# - "Find models with accuracy > 90%"
# - "What dataset was used for llama2-7b:1.0.0?"
# - "What git commit produced this model?"
# - "Re-train exact model (same data, code, hyperparameters)"
#
# Provenance answers:
# Q: Why did accuracy drop from 92% to 88%?
# A: Dataset changed from openwebtext-v1 (SHA256: abc123) to openwebtext-v2 (SHA256: def456)
#
# Q: Can we reproduce this model?
# A: Yes. Git commit abc1234, openwebtext-v1 dataset, learning_rate=0.001, batch_size=32
#
# Q: Who trained this model?
# A: alice@example.com on 2024-01-15 using 8x A100 GPUs
#
# Q: Is this model GDPR compliant?
# A: Yes. Training dataset provenance shows opt-out handling.
