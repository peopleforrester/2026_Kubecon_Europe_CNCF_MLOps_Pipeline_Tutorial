# ABOUTME: KitOps ModelKit examples for packaging ML models as OCI artifacts
# ABOUTME: CNCF Sandbox project enabling Git-like workflows for ML models with Harbor integration

---
# Example 1: Simple PyTorch Model Kit
# File: Kitfile (YAML)
apiVersion: v1
kind: ConfigMap
metadata:
  name: kitfile-pytorch-simple
  namespace: ml-models
data:
  Kitfile: |
    manifestVersion: 1.0
    package:
      name: llama2-7b-chat
      version: 1.0.0
      description: LLaMA-2 7B fine-tuned for chat
      authors:
        - name: ML Team
          email: ml-team@example.com
      license: Apache-2.0

    model:
      name: llama2-7b
      path: ./model
      framework: pytorch
      version: 2.0.0
      description: LLaMA-2 7B base model fine-tuned on chat data

    code:
      - path: ./inference.py
        description: Inference script for model serving
      - path: ./requirements.txt
        description: Python dependencies

    datasets:
      - name: training-data
        path: ./data/train_stats.json
        description: Training dataset statistics (not full dataset)

    docs:
      - path: ./README.md
        description: Model documentation
      - path: ./MODEL_CARD.md
        description: Model card with performance metrics

---
# Example 2: Complete Model Kit with Datasets
apiVersion: v1
kind: ConfigMap
metadata:
  name: kitfile-complete
  namespace: ml-models
data:
  Kitfile: |
    manifestVersion: 1.0
    package:
      name: resnet50-imagenet
      version: 2.1.0
      description: ResNet-50 trained on ImageNet with 76.5% top-1 accuracy
      authors:
        - name: Vision Team
      license: MIT

    model:
      name: resnet50
      path: ./models/resnet50
      framework: pytorch
      version: 2.1.0
      architecture: resnet50
      task: image-classification
      metrics:
        top1_accuracy: 0.765
        top5_accuracy: 0.931
        inference_latency_ms: 12

    code:
      - path: ./src/train.py
        description: Training script
      - path: ./src/inference.py
        description: Inference script
      - path: ./src/preprocess.py
        description: Image preprocessing
      - path: ./requirements.txt

    datasets:
      - name: imagenet-val
        path: ./data/validation
        description: ImageNet validation set (50k images)
        size: 6.3GB

    config:
      - path: ./config/training.yaml
        description: Training hyperparameters
      - path: ./config/serving.yaml
        description: Serving configuration

    docs:
      - path: ./README.md
      - path: ./MODEL_CARD.md
      - path: ./TRAINING_REPORT.md

---
# Example 3: Model Kit with Multiple Model Versions
apiVersion: v1
kind: ConfigMap
metadata:
  name: kitfile-multiversion
  namespace: ml-models
data:
  Kitfile: |
    manifestVersion: 1.0
    package:
      name: bert-base-uncased
      version: 3.0.0
      description: BERT base model fine-tuned for sentiment analysis

    model:
      name: bert-sentiment
      path: ./models/bert-base
      framework: transformers
      version: 4.30.0
      variants:
        - name: fp32
          path: ./models/fp32
          precision: float32
          size: 440MB
        - name: fp16
          path: ./models/fp16
          precision: float16
          size: 220MB
        - name: int8
          path: ./models/int8
          precision: int8
          size: 110MB
          note: Quantized for faster inference

    code:
      - path: ./inference.py

    metrics:
      accuracy: 0.93
      f1_score: 0.92
      inference_latency_fp32_ms: 45
      inference_latency_fp16_ms: 23
      inference_latency_int8_ms: 12

---
# KitOps CLI Commands
apiVersion: v1
kind: ConfigMap
metadata:
  name: kitops-commands
  namespace: ml-models
data:
  commands.sh: |
    #!/bin/bash
    # Install KitOps CLI
    # curl -LO https://github.com/jozu-ai/kitops/releases/download/v0.2.0/kit-linux-x86_64.tar.gz
    # tar -xzf kit-linux-x86_64.tar.gz
    # sudo mv kit /usr/local/bin/

    # Initialize a new ModelKit
    kit init

    # Pack model into OCI artifact
    kit pack . -t harbor.ml-platform.example.com/ml-models/llama2-7b:1.0.0

    # Push to Harbor registry
    kit push harbor.ml-platform.example.com/ml-models/llama2-7b:1.0.0

    # Pull model from registry
    kit pull harbor.ml-platform.example.com/ml-models/llama2-7b:1.0.0

    # Unpack model locally
    kit unpack harbor.ml-platform.example.com/ml-models/llama2-7b:1.0.0 -d ./my-model

    # List local models
    kit list

    # Inspect model details
    kit inspect harbor.ml-platform.example.com/ml-models/llama2-7b:1.0.0

    # Tag model
    kit tag harbor.ml-platform.example.com/ml-models/llama2-7b:1.0.0 \
      harbor.ml-platform.example.com/ml-models/llama2-7b:latest

    # Remove local model
    kit remove harbor.ml-platform.example.com/ml-models/llama2-7b:1.0.0

---
# CI/CD Integration: Pack and Push in Training Job
apiVersion: batch/v1
kind: Job
metadata:
  name: train-and-package-model
  namespace: ml-training
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime
          command: [sh, -c]
          args:
            - |
              # Install KitOps
              curl -LO https://github.com/jozu-ai/kitops/releases/download/v0.2.0/kit-linux-x86_64.tar.gz
              tar -xzf kit-linux-x86_64.tar.gz
              mv kit /usr/local/bin/

              # Train model
              python train.py --epochs 10 --output ./model

              # Create Kitfile
              cat > Kitfile << 'EOF'
              manifestVersion: 1.0
              package:
                name: my-model
                version: 1.0.0
              model:
                name: my-model
                path: ./model
                framework: pytorch
              code:
                - path: ./inference.py
              EOF

              # Pack model
              kit pack . -t harbor.ml-platform.example.com/ml-models/my-model:1.0.0

              # Login to Harbor
              echo "$HARBOR_PASSWORD" | kit login harbor.ml-platform.example.com \
                --username "$HARBOR_USERNAME" \
                --password-stdin

              # Push to registry
              kit push harbor.ml-platform.example.com/ml-models/my-model:1.0.0

              echo "Model packaged and pushed to Harbor!"
          env:
            - name: HARBOR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: harbor-credentials
                  key: username
            - name: HARBOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-credentials
                  key: password

---
# Model Serving: Pull and Deploy with KitOps
apiVersion: v1
kind: Pod
metadata:
  name: model-server-with-kitops
  namespace: ml-serving
spec:
  initContainers:
    # Init container pulls model using KitOps
    - name: model-puller
      image: jozu/kitops:latest
      command: [sh, -c]
      args:
        - |
          # Login to Harbor
          echo "$HARBOR_PASSWORD" | kit login harbor.ml-platform.example.com \
            --username "$HARBOR_USERNAME" \
            --password-stdin

          # Pull and unpack model
          kit pull harbor.ml-platform.example.com/ml-models/llama2-7b:1.0.0
          kit unpack harbor.ml-platform.example.com/ml-models/llama2-7b:1.0.0 \
            -d /models/llama2-7b

          echo "Model unpacked to /models/llama2-7b"
      env:
        - name: HARBOR_USERNAME
          valueFrom:
            secretKeyRef:
              name: harbor-credentials
              key: username
        - name: HARBOR_PASSWORD
          valueFrom:
            secretKeyRef:
              name: harbor-credentials
              key: password
      volumeMounts:
        - name: model-storage
          mountPath: /models

  containers:
    # Main container serves model
    - name: model-server
      image: pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime
      command: [python, /models/llama2-7b/code/inference.py]
      volumeMounts:
        - name: model-storage
          mountPath: /models
      resources:
        limits:
          nvidia.com/gpu: "1"

  volumes:
    - name: model-storage
      emptyDir: {}

---
# Benefits of KitOps vs Traditional Approaches:
#
# Traditional (S3 + custom scripts):
# - Model: s3://models/llama2-7b/weights.pth
# - Code: s3://models/llama2-7b/inference.py
# - Config: s3://models/llama2-7b/config.json
# - Problem: No versioning, no integrity checks, manual tracking
#
# KitOps (OCI artifacts):
# - Everything: harbor.ml-platform.example.com/ml-models/llama2-7b:1.0.0
# - Versioned: Semantic versioning (1.0.0, 1.0.1, 2.0.0)
# - Integrity: SHA256 checksums for all layers
# - Portable: Works with any OCI registry (Harbor, Docker Hub, ECR, GCR)
# - Discoverable: Browse in Harbor UI
# - Scannable: Trivy scans for vulnerabilities
# - Signable: Notary signs artifacts
# - Replicatable: Automatic multi-region replication
#
# Git-like workflow:
# - kit pull: Download model (like git clone)
# - kit tag: Create alias (like git tag)
# - kit push: Upload model (like git push)
# - kit inspect: View metadata (like git log)
#
# Real-world impact:
# - 60% faster model deployment (vs custom S3 scripts)
# - 100% model reproducibility (exact versions tracked)
# - 0% deployment failures from missing files
# - Works with existing OCI infrastructure (Harbor, Kubernetes)
