# ABOUTME: Model versioning and tagging strategies for reproducible ML deployments
# ABOUTME: Semantic versioning, environment tagging, and promotion workflows for ML artifacts

---
# Versioning Strategy: Semantic Versioning for ML Models
# Format: MAJOR.MINOR.PATCH
# - MAJOR: Breaking API changes, different architecture
# - MINOR: New features, improved accuracy (backward compatible)
# - PATCH: Bug fixes, performance improvements

apiVersion: v1
kind: ConfigMap
metadata:
  name: versioning-guide
  namespace: ml-models
data:
  VERSIONING.md: |
    # Model Versioning Guide

    ## Semantic Versioning for ML Models

    ### Version Format: MAJOR.MINOR.PATCH

    **MAJOR (e.g., 1.0.0 → 2.0.0):**
    - Different model architecture (ResNet → ViT)
    - Breaking API changes (different input/output format)
    - Different training objective
    - Requires code changes in consuming applications

    Example:
    ```
    bert-base-uncased:1.5.2  # BERT architecture
    bert-base-uncased:2.0.0  # RoBERTa architecture (breaking)
    ```

    **MINOR (e.g., 1.0.0 → 1.1.0):**
    - Improved accuracy (new training data)
    - Additional features (multi-language support)
    - Backward compatible changes
    - Same API, better performance

    Example:
    ```
    fraud-detector:1.0.0  # 85% accuracy
    fraud-detector:1.1.0  # 88% accuracy (retrained)
    ```

    **PATCH (e.g., 1.0.0 → 1.0.1):**
    - Bug fixes (preprocessing errors)
    - Performance optimizations
    - No accuracy changes
    - Hotfixes

    Example:
    ```
    resnet50:1.0.0  # Original
    resnet50:1.0.1  # Fixed image normalization bug
    ```

    ## Tags for Environment Promotion

    ### Development Tags
    - `model:dev` - Latest development version
    - `model:dev-YYYYMMDD` - Daily dev builds
    - `model:feature-xyz` - Feature branch models

    ### Staging Tags
    - `model:staging` - Current staging version
    - `model:rc-1.2.0` - Release candidate

    ### Production Tags
    - `model:latest` - Latest production version
    - `model:stable` - Last known good version
    - `model:1.2.0` - Specific semantic version

    ## Immutable Tags vs Mutable Tags

    **Immutable (never change):**
    - `model:1.2.0` - Semantic versions
    - `model:sha256-abc123` - Content-addressable

    **Mutable (can change):**
    - `model:latest` - Points to newest version
    - `model:prod` - Points to current production
    - `model:staging` - Points to current staging

    ## Model Metadata in Image Labels

    Every model image should include:
    - `org.opencontainers.image.version` - Semantic version
    - `ml.model.name` - Model name
    - `ml.model.framework` - PyTorch, TensorFlow, etc.
    - `ml.model.task` - Classification, detection, etc.
    - `ml.training.date` - Training completion date
    - `ml.training.dataset` - Dataset name and version
    - `ml.metrics.accuracy` - Model accuracy
    - `ml.git.commit` - Git commit SHA

