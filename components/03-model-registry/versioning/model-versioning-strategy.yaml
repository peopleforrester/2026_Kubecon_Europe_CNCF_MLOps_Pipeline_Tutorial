# Retention Policy: Keep Last N Versions
apiVersion: v1
kind: ConfigMap
metadata:
  name: retention-policy
  namespace: ml-models
data:
  retention-config.json: |
    {
      "rules": [
        {
          "disabled": false,
          "action": "retain",
          "template": "latestPushedK",
          "params": {
            "latestPushedK": 10
          },
          "tag_selectors": [
            {
              "kind": "doublestar",
              "decoration": "matches",
              "pattern": "**"
            }
          ],
          "scope_selectors": {
            "repository": [
              {
                "kind": "doublestar",
                "decoration": "repoMatches",
                "pattern": "**"
              }
            ]
          }
        },
        {
          "disabled": false,
          "action": "retain",
          "template": "always",
          "tag_selectors": [
            {
              "kind": "doublestar",
              "decoration": "matches",
              "pattern": "latest"
            },
            {
              "kind": "doublestar",
              "decoration": "matches",
              "pattern": "prod"
            },
            {
              "kind": "doublestar",
              "decoration": "matches",
              "pattern": "stable"
            }
          ],
          "scope_selectors": {
            "repository": [
              {
                "kind": "doublestar",
                "decoration": "repoMatches",
                "pattern": "**"
              }
            ]
          }
        }
      ]
    }

---
# Best Practices Summary:
#
# 1. Versioning:
#    - Use semantic versioning (MAJOR.MINOR.PATCH)
#    - Immutable version tags (1.2.0 never changes)
#    - Git commit in tag (1.2.0-abc1234)
#
# 2. Environment Tags:
#    - dev, staging, prod tags point to current version
#    - Promote by re-tagging (staging → prod)
#    - Keep backup tags (prod-backup-1.1.0)
#
# 3. Metadata:
#    - Include accuracy, training date, dataset version
#    - OCI image labels for discoverability
#    - Queryable via Harbor API
#
# 4. Retention:
#    - Keep last 10 versions per model
#    - Never delete prod/stable tags
#    - Automated garbage collection
#
# 5. Promotion:
#    - Staging → Validation → Production
#    - Automated tests before promotion
#    - Rollback capability (revert tags)
#
# Real-world impact:
# - 100% model reproducibility
# - 0% "which model is in prod?" questions
# - Instant rollback (re-tag previous version)
# - Clear audit trail (who promoted when)
