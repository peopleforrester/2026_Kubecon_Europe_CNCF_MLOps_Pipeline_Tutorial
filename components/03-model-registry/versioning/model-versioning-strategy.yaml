# Example: Tagging Models in CI/CD Pipeline
apiVersion: batch/v1
kind: Job
metadata:
  name: tag-model-pipeline
  namespace: ml-models
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: tagger
          image: alpine:latest
          command: [sh, -c]
          args:
            - |
              # Variables from CI/CD
              MODEL_NAME="llama2-7b"
              GIT_COMMIT="abc1234"
              TRAINING_DATE="2024-01-15"
              ACCURACY="0.892"
              SEMANTIC_VERSION="1.2.0"

              # Harbor registry
              REGISTRY="harbor.ml-platform.example.com/ml-models"

              # Generate tags
              echo "Tagging model ${MODEL_NAME}:${SEMANTIC_VERSION}"

              # Immutable tags
              TAGS=(
                "${SEMANTIC_VERSION}"
                "${SEMANTIC_VERSION}-${GIT_COMMIT}"
                "sha256-$(echo $GIT_COMMIT | cut -c1-12)"
              )

              # Mutable tags (if production)
              if [ "$ENVIRONMENT" = "production" ]; then
                TAGS+=("latest")
                TAGS+=("stable")
                TAGS+=("prod")
              fi

              # Mutable tags (if staging)
              if [ "$ENVIRONMENT" = "staging" ]; then
                TAGS+=("staging")
                TAGS+=("rc-${SEMANTIC_VERSION}")
              fi

              # Apply tags
              for TAG in "${TAGS[@]}"; do
                echo "Tagging: ${REGISTRY}/${MODEL_NAME}:${TAG}"
                # docker tag ${MODEL_NAME}:build ${REGISTRY}/${MODEL_NAME}:${TAG}
                # docker push ${REGISTRY}/${MODEL_NAME}:${TAG}
              done

              echo "Model tagged successfully!"

