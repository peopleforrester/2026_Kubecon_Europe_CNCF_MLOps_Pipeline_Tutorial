# Model Registry API: Query Models by Metadata
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-query-examples
  namespace: ml-models
data:
  query-models.sh: |
    #!/bin/bash
    # Query Harbor API for models with specific criteria

    HARBOR_URL="https://harbor.ml-platform.example.com"
    HARBOR_USER="admin"
    HARBOR_PASSWORD="Harbor12345"

    # Find all models with accuracy > 0.90
    curl -u "$HARBOR_USER:$HARBOR_PASSWORD" \
      "$HARBOR_URL/api/v2.0/projects/ml-models/repositories" \
      | jq '.[] | select(.labels |
        any(.name == "ml.metrics.accuracy" and (.value | tonumber) > 0.90))'

    # Find models trained in last 30 days
    THIRTY_DAYS_AGO=$(date -d '30 days ago' +%Y-%m-%d)
    curl -u "$HARBOR_USER:$HARBOR_PASSWORD" \
      "$HARBOR_URL/api/v2.0/projects/ml-models/repositories" \
      | jq --arg date "$THIRTY_DAYS_AGO" \
        '.[] | select(.labels |
          any(.name == "ml.training.date" and .value > $date))'

    # Find all PyTorch models
    curl -u "$HARBOR_USER:$HARBOR_PASSWORD" \
      "$HARBOR_URL/api/v2.0/projects/ml-models/repositories" \
      | jq '.[] | select(.labels |
        any(.name == "ml.model.framework" and .value == "pytorch"))'

