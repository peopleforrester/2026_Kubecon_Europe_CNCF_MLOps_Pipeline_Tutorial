# Model Promotion Workflow
apiVersion: v1
kind: ConfigMap
metadata:
  name: promotion-workflow
  namespace: ml-models
data:
  promote.sh: |
    #!/bin/bash
    # Promote model from staging to production

    MODEL_NAME=$1
    VERSION=$2
    REGISTRY="harbor.ml-platform.example.com/ml-models"

    # Validation
    if [ -z "$MODEL_NAME" ] || [ -z "$VERSION" ]; then
      echo "Usage: $0 <model-name> <version>"
      exit 1
    fi

    # Check if model exists in staging
    STAGING_TAG="${REGISTRY}/${MODEL_NAME}:staging"
    if ! docker pull "$STAGING_TAG"; then
      echo "Error: Model not found in staging"
      exit 1
    fi

    # Run validation tests
    echo "Running validation tests..."
    # docker run --rm $STAGING_TAG python test.py
    # if [ $? -ne 0 ]; then
    #   echo "Validation tests failed!"
    #   exit 1
    # fi

    echo "Validation passed!"

    # Promote to production
    echo "Promoting ${MODEL_NAME}:${VERSION} to production..."

    # Tag as production
    docker tag "$STAGING_TAG" "${REGISTRY}/${MODEL_NAME}:${VERSION}"
    docker tag "$STAGING_TAG" "${REGISTRY}/${MODEL_NAME}:latest"
    docker tag "$STAGING_TAG" "${REGISTRY}/${MODEL_NAME}:prod"

    # Push production tags
    docker push "${REGISTRY}/${MODEL_NAME}:${VERSION}"
    docker push "${REGISTRY}/${MODEL_NAME}:latest"
    docker push "${REGISTRY}/${MODEL_NAME}:prod"

    # Create backup of previous production
    PREVIOUS_VERSION=$(docker inspect ${REGISTRY}/${MODEL_NAME}:prod \
      --format='{{index .Config.Labels "org.opencontainers.image.version"}}')

    if [ -n "$PREVIOUS_VERSION" ]; then
      docker tag "${REGISTRY}/${MODEL_NAME}:prod" \
        "${REGISTRY}/${MODEL_NAME}:prod-backup-${PREVIOUS_VERSION}"
      docker push "${REGISTRY}/${MODEL_NAME}:prod-backup-${PREVIOUS_VERSION}"
    fi

    echo "✓ Model promoted to production: ${VERSION}"
    echo "  Previous version backed up: ${PREVIOUS_VERSION}"

