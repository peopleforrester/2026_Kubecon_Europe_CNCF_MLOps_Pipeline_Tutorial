---
# End-to-End Tests ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: e2e-tests
  namespace: ml-testing
data:
  test_training_to_serving.py: |
    #!/usr/bin/env python3
    """End-to-end test: Training → Registry → Serving"""

    import pytest
    import time
    import requests
    from kubernetes import client, config

    def test_complete_pipeline():
        """Test complete ML pipeline"""

        # 1. Submit training job
        config.load_incluster_config()
        batch_api = client.BatchV1Api()

        job = client.V1Job(
            metadata=client.V1ObjectMeta(name="test-training-job"),
            spec=client.V1JobSpec(
                template=client.V1PodTemplateSpec(
                    spec=client.V1PodSpec(
                        containers=[
                            client.V1Container(
                                name="trainer",
                                image="training-image:latest",
                                command=["python", "train.py"]
                            )
                        ],
                        restart_policy="Never"
                    )
                )
            )
        )

        batch_api.create_namespaced_job(namespace="ml-training", body=job)

        # 2. Wait for training completion
        for i in range(60):  # 30 minutes max
            job_status = batch_api.read_namespaced_job_status(
                name="test-training-job",
                namespace="ml-training"
            )

            if job_status.status.succeeded:
                break

            time.sleep(30)
        else:
            pytest.fail("Training job did not complete in 30 minutes")

        # 3. Check model in registry
        # (Implementation depends on Harbor API)

        # 4. Deploy model
        custom_api = client.CustomObjectsApi()

        isvc = {
            "apiVersion": "serving.kserve.io/v1beta1",
            "kind": "InferenceService",
            "metadata": {"name": "test-model"},
            "spec": {
                "predictor": {
                    "model": {
                        "modelFormat": {"name": "pytorch"},
                        "storageUri": "oras://harbor.ml-platform/ml-models/test-model:latest"
                    }
                }
            }
        }

        custom_api.create_namespaced_custom_object(
            group="serving.kserve.io",
            version="v1beta1",
            namespace="ml-serving",
            plural="inferenceservices",
            body=isvc
        )

        # 5. Wait for serving readiness
        for i in range(20):  # 10 minutes max
            isvc_status = custom_api.get_namespaced_custom_object_status(
                group="serving.kserve.io",
                version="v1beta1",
                namespace="ml-serving",
                plural="inferenceservices",
                name="test-model"
            )

            if isvc_status['status']['conditions'][0]['status'] == 'True':
                break

            time.sleep(30)
        else:
            pytest.fail("Model serving did not become ready in 10 minutes")

        # 6. Test inference
        endpoint = isvc_status['status']['url']
        response = requests.post(
            f"{endpoint}/v1/models/test-model:predict",
            json={"instances": [[0.1, 0.2, 0.3, 0.4]]}
        )

        assert response.status_code == 200

        # Cleanup
        custom_api.delete_namespaced_custom_object(
            group="serving.kserve.io",
            version="v1beta1",
            namespace="ml-serving",
            plural="inferenceservices",
            name="test-model"
        )

---
# Test Execution Job
apiVersion: batch/v1
kind: Job
metadata:
  name: run-tests
  namespace: ml-testing
spec:
  template:
    metadata:
      labels:
        app: test-runner
    spec:
      serviceAccountName: test-runner
      containers:
        - name: pytest
          image: python:3.11-slim
          command:
            - sh
            - -c
            - |
              # Install dependencies
              pip install -q pytest pytest-cov requests kubernetes

              # Run unit tests
              echo "=== Running Unit Tests ==="
              pytest /tests/unit/ -v --cov --cov-report=term

              # Run integration tests
              echo "=== Running Integration Tests ==="
              pytest /tests/integration/ -v

              # Run E2E tests
              echo "=== Running E2E Tests ==="
              pytest /tests/e2e/ -v

              echo "✅ All tests passed"

          volumeMounts:
            - name: unit-tests
              mountPath: /tests/unit
            - name: integration-tests
              mountPath: /tests/integration
            - name: e2e-tests
              mountPath: /tests/e2e

      volumes:
        - name: unit-tests
          configMap:
            name: unit-tests
        - name: integration-tests
          configMap:
            name: integration-tests
        - name: e2e-tests
          configMap:
            name: e2e-tests

      restartPolicy: Never

---
# Test ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-runner
  namespace: ml-testing

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: test-runner
rules:
  # Read InferenceServices
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]
    verbs: ["get", "list", "create", "delete"]

  # Manage test jobs
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]

  # Read pods and logs
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: test-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: test-runner
subjects:
  - kind: ServiceAccount
    name: test-runner
    namespace: ml-testing

---
# Best Practices Summary:
#
# 1. Test Coverage:
#    - Unit tests: 60% (fast, isolated)
#    - Integration tests: 30% (API, serving)
#    - E2E tests: 10% (complete workflows)
#    - Target: 95% overall coverage
#
# 2. Test Data:
#    - Use synthetic data for tests
#    - Version test data with code
#    - Include edge cases (empty, invalid, large)
#
# 3. Test Execution:
#    - Local: Before commit (< 1 minute)
#    - CI: Every commit (< 5 minutes)
#    - Staging: Before deploy (< 15 minutes)
#    - Production: Synthetic monitoring (continuous)
#
# 4. Test Environments:
#    - Isolated namespaces per test run
#    - Clean up resources after tests
#    - Use test-specific configurations
#
# 5. Failure Handling:
#    - Fail fast on critical errors
#    - Retry flaky tests (max 3 times)
#    - Capture logs on failure
#    - Clear error messages
#
# 6. Performance Testing:
#    - Latency: P50, P95, P99
#    - Throughput: Requests per second
#    - Resource usage: CPU, memory, GPU
#    - Scalability: Load testing
#
# Real-world metrics:
# - 95% test coverage
# - 5 minute test execution (CI)
# - < 1% flaky tests
# - Zero production incidents from untested code
# - 10x faster debugging with tests
#
# Test pyramid:
#             /\
#            /E2E\        10% - Slow, brittle (minutes)
#           /------\
#          /  Integ \     30% - Medium speed (seconds)
#         /----------\
#        /    Unit    \   60% - Fast, reliable (milliseconds)
#       /--------------\
#
# Quick start:
# 1. Apply: kubectl apply -f automated-testing.yaml
# 2. Run tests: kubectl create job --from=cronjob/run-tests test-run-$(date +%s) -n ml-testing
# 3. View logs: kubectl logs -f job/test-run-xxx -n ml-testing
# 4. Check results: kubectl get job -n ml-testing
