---
# Benefits of PyTorchJob vs Manual Volcano Job:
#
# 1. Automatic Environment Setup:
#    PyTorchJob: ✓ Auto-sets MASTER_ADDR, MASTER_PORT, RANK, WORLD_SIZE
#    Volcano: ✗ Must manually configure environment variables
#
# 2. Service Creation:
#    PyTorchJob: ✓ Automatically creates headless service for master
#    Volcano: ✗ Must manually create service
#
# 3. Elastic Training:
#    PyTorchJob: ✓ Built-in support (elasticPolicy)
#    Volcano: ✗ Must implement manually
#
# 4. Monitoring:
#    PyTorchJob: ✓ Status tracking via .status.conditions
#    Volcano: ⚠ Basic status only
#
# 5. Integration:
#    PyTorchJob: ✓ Integrates with Katib for hyperparameter tuning
#    Volcano: ⚠ Manual integration needed
#
# When to use PyTorchJob:
# - Simple PyTorch DDP training
# - Need automatic environment setup
# - Want Katib integration
# - Team familiar with Kubeflow
#
# When to use Volcano Job:
# - Need advanced gang scheduling features
# - Using other frameworks (TensorFlow, MXNet)
# - Complex job dependencies
# - Custom scheduling logic
#
# Recommendation: Use PyTorchJob + Volcano scheduler together:
# - PyTorchJob for easy DDP setup
# - Configure Volcano as scheduler for gang scheduling
# - Best of both worlds!
#
# Example configuration:
# spec:
#   schedulerName: volcano  # Use Volcano for gang scheduling
#   pytorchReplicaSpecs:
#     Master: ...
#     Worker: ...
