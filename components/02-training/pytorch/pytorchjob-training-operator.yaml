# ABOUTME: PyTorchJob CRD using Kubeflow Training Operator for managed distributed training
# ABOUTME: Simplifies PyTorch DDP by automatically handling MASTER_ADDR, RANK, WORLD_SIZE environment variables

---
# Install Training Operator first:
# kubectl apply -k "github.com/kubeflow/training-operator/manifests/overlays/standalone?ref=v1.7.0"

apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: resnet50-imagenet-training
  namespace: ml-training
  labels:
    app: resnet50-training
    dataset: imagenet
spec:
  # PyTorchJob automatically sets up distributed training environment
  # No need to manually configure MASTER_ADDR, RANK, WORLD_SIZE

  # Elastic training (optional): allows dynamic scaling
  elasticPolicy:
    rdzvBackend: c10d
    minReplicas: 1
    maxReplicas: 4
    maxRestarts: 10

  # Training configuration
  pytorchReplicaSpecs:
    # Master replica (rank 0)
    Master:
      replicas: 1
      restartPolicy: OnFailure
      template:
        metadata:
          labels:
            app: pytorch-master
        spec:
          containers:
            - name: pytorch
              image: pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime
              command: [sh, -c]
              args:
                - |
                  set -e

                  echo "=========================================="
                  echo "PyTorchJob Master (Rank 0)"
                  echo "=========================================="
                  echo "Environment variables (auto-configured):"
                  echo "  MASTER_ADDR: $MASTER_ADDR"
                  echo "  MASTER_PORT: $MASTER_PORT"
                  echo "  RANK: $RANK"
                  echo "  WORLD_SIZE: $WORLD_SIZE"
                  echo "=========================================="

                  # Install dependencies
                  pip install -q torchvision pillow

                  # Training script
                  cat > train_resnet.py << 'EOF'
import os
import torch
import torch.distributed as dist
import torch.nn as nn
import torch.optim as optim
from torch.nn.parallel import DistributedDataParallel as DDP
from torch.utils.data import DataLoader, DistributedSampler
from torchvision import datasets, transforms, models

def setup():
    # PyTorchJob automatically sets RANK, WORLD_SIZE, MASTER_ADDR, MASTER_PORT
    dist.init_process_group(backend='nccl')

    local_rank = int(os.environ.get('LOCAL_RANK', 0))
    torch.cuda.set_device(local_rank)

    return local_rank

def cleanup():
    dist.destroy_process_group()

def create_model(local_rank):
    """Create ResNet-50 model"""
    model = models.resnet50(pretrained=False, num_classes=1000)
    model = model.to(local_rank)
    model = DDP(model, device_ids=[local_rank])
    return model

def create_dataloader(batch_size):
    """Create ImageNet dataloader"""
    # For demo, use CIFAR-10 (smaller)
    transform = transforms.Compose([
        transforms.Resize(224),
        transforms.ToTensor(),
        transforms.Normalize(mean=[0.485, 0.456, 0.406],
                           std=[0.229, 0.224, 0.225])
    ])

    dataset = datasets.CIFAR10(
        root='./data',
        train=True,
        download=True,
        transform=transform
    )

    # Distributed sampler
    sampler = DistributedSampler(
        dataset,
        num_replicas=dist.get_world_size(),
        rank=dist.get_rank(),
        shuffle=True
    )

    dataloader = DataLoader(
        dataset,
        batch_size=batch_size,
        sampler=sampler,
        num_workers=4,
        pin_memory=True
    )

    return dataloader

def train_epoch(model, dataloader, optimizer, criterion, epoch, local_rank, rank):
    """Train one epoch"""
    model.train()
    running_loss = 0.0

    for i, (inputs, labels) in enumerate(dataloader):
        inputs = inputs.to(local_rank)
        labels = labels.to(local_rank)

        optimizer.zero_grad()
        outputs = model(inputs)
        loss = criterion(outputs, labels)
        loss.backward()
        optimizer.step()

        running_loss += loss.item()

        if i % 10 == 0 and rank == 0:
            print(f"Epoch {epoch}, Batch {i}, Loss: {loss.item():.4f}")

    avg_loss = running_loss / len(dataloader)

    if rank == 0:
        print(f"Epoch {epoch} completed. Avg Loss: {avg_loss:.4f}")

    return avg_loss

def main():
    # Setup distributed training
    local_rank = setup()
    rank = dist.get_rank()
    world_size = dist.get_world_size()

    if rank == 0:
        print(f"Training ResNet-50 on {world_size} GPUs")

    # Create model, dataloader, optimizer
    model = create_model(local_rank)
    dataloader = create_dataloader(batch_size=128)
    criterion = nn.CrossEntropyLoss()
    optimizer = optim.SGD(model.parameters(), lr=0.1, momentum=0.9, weight_decay=1e-4)

    # Training loop
    num_epochs = 10

    for epoch in range(num_epochs):
        # Set epoch for distributed sampler (ensures different shuffle each epoch)
        dataloader.sampler.set_epoch(epoch)

        avg_loss = train_epoch(model, dataloader, optimizer, criterion, epoch, local_rank, rank)

        # Save checkpoint (only on rank 0)
        if rank == 0 and epoch % 2 == 0:
            checkpoint = {
                'epoch': epoch,
                'model_state_dict': model.module.state_dict(),
                'optimizer_state_dict': optimizer.state_dict(),
                'loss': avg_loss,
            }
            torch.save(checkpoint, f'/workspace/checkpoints/resnet50_epoch_{epoch}.pt')
            print(f"Checkpoint saved: epoch {epoch}")

    # Cleanup
    cleanup()

    if rank == 0:
        print("Training completed successfully!")

if __name__ == "__main__":
    main()
EOF

                  # Run training
                  python train_resnet.py

              volumeMounts:
                - name: checkpoint-storage
                  mountPath: /workspace/checkpoints
                - name: shm
                  mountPath: /dev/shm

              resources:
                requests:
                  cpu: "8"
                  memory: "32Gi"
                  nvidia.com/gpu: "1"
                limits:
                  cpu: "16"
                  memory: "64Gi"
                  nvidia.com/gpu: "1"

          volumes:
            - name: checkpoint-storage
              persistentVolumeClaim:
                claimName: training-checkpoints
            - name: shm
              emptyDir:
                medium: Memory
                sizeLimit: 8Gi

    # Worker replicas (rank 1, 2, 3)
    Worker:
      replicas: 3  # 3 workers + 1 master = 4 GPUs total
      restartPolicy: OnFailure
      template:
        metadata:
          labels:
            app: pytorch-worker
        spec:
          containers:
            - name: pytorch
              image: pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime
              command: [sh, -c]
              args:
                - |
                  echo "Worker Rank: $RANK"

                  pip install -q torchvision pillow

                  # Same training script as master
                  cat > train_resnet.py << 'EOF'
# (same training script as master)
import os
import torch
import torch.distributed as dist
import torch.nn as nn
import torch.optim as optim
from torch.nn.parallel import DistributedDataParallel as DDP
from torch.utils.data import DataLoader, DistributedSampler
from torchvision import datasets, transforms, models

def setup():
    dist.init_process_group(backend='nccl')
    local_rank = int(os.environ.get('LOCAL_RANK', 0))
    torch.cuda.set_device(local_rank)
    return local_rank

def cleanup():
    dist.destroy_process_group()

def create_model(local_rank):
    model = models.resnet50(pretrained=False, num_classes=1000)
    model = model.to(local_rank)
    model = DDP(model, device_ids=[local_rank])
    return model

def create_dataloader(batch_size):
    transform = transforms.Compose([
        transforms.Resize(224),
        transforms.ToTensor(),
        transforms.Normalize(mean=[0.485, 0.456, 0.406],
                           std=[0.229, 0.224, 0.225])
    ])
    dataset = datasets.CIFAR10(root='./data', train=True, download=True, transform=transform)
    sampler = DistributedSampler(dataset, num_replicas=dist.get_world_size(), rank=dist.get_rank(), shuffle=True)
    dataloader = DataLoader(dataset, batch_size=batch_size, sampler=sampler, num_workers=4, pin_memory=True)
    return dataloader

def train_epoch(model, dataloader, optimizer, criterion, epoch, local_rank, rank):
    model.train()
    running_loss = 0.0
    for i, (inputs, labels) in enumerate(dataloader):
        inputs = inputs.to(local_rank)
        labels = labels.to(local_rank)
        optimizer.zero_grad()
        outputs = model(inputs)
        loss = criterion(outputs, labels)
        loss.backward()
        optimizer.step()
        running_loss += loss.item()
        if i % 10 == 0 and rank == 0:
            print(f"Epoch {epoch}, Batch {i}, Loss: {loss.item():.4f}")
    avg_loss = running_loss / len(dataloader)
    if rank == 0:
        print(f"Epoch {epoch} completed. Avg Loss: {avg_loss:.4f}")
    return avg_loss

def main():
    local_rank = setup()
    rank = dist.get_rank()
    world_size = dist.get_world_size()
    if rank == 0:
        print(f"Training ResNet-50 on {world_size} GPUs")
    model = create_model(local_rank)
    dataloader = create_dataloader(batch_size=128)
    criterion = nn.CrossEntropyLoss()
    optimizer = optim.SGD(model.parameters(), lr=0.1, momentum=0.9, weight_decay=1e-4)
    num_epochs = 10
    for epoch in range(num_epochs):
        dataloader.sampler.set_epoch(epoch)
        avg_loss = train_epoch(model, dataloader, optimizer, criterion, epoch, local_rank, rank)
    cleanup()
    if rank == 0:
        print("Training completed successfully!")

if __name__ == "__main__":
    main()
EOF

