---
# Example 2: Training job with fractional GPU (saves cost on small models)
# Scenario: Fine-tuning DistilBERT only needs 10GB GPU memory (A100 has 80GB)
# Without HAMi: Waste 70GB ($28/hour wasted assuming $32/hour for A100)
# With HAMi: Use only 10GB, share rest with other jobs

apiVersion: v1
kind: Pod
metadata:
  name: distilbert-finetuning
  namespace: ml-training
  labels:
    app: finetuning
    model: distilbert
spec:
  containers:
    - name: trainer
      image: pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime
      command: [sh, -c]
      args:
        - |
          echo "Fine-tuning DistilBERT with 10GB GPU memory allocation"

          python3 << 'EOF'
          import torch
          from transformers import DistilBertForSequenceClassification, Trainer, TrainingArguments

          # HAMi enforces 10GB memory limit
          device = torch.device("cuda:0")

          model = DistilBertForSequenceClassification.from_pretrained(
              'distilbert-base-uncased',
              num_labels=2
          ).to(device)

          training_args = TrainingArguments(
              output_dir='./results',
              per_device_train_batch_size=8,
              num_train_epochs=3,
              fp16=True  # Mixed precision to save memory
          )

          # Training loop
          print("Training started with HAMi GPU memory isolation...")
          # trainer = Trainer(model=model, args=training_args, ...)
          # trainer.train()

          print("Training complete!")
          print(f"Peak GPU memory: {torch.cuda.max_memory_allocated(0) / 1024**3:.2f} GB")
          EOF

          sleep infinity
      resources:
        limits:
          nvidia.com/gpu: 1
          nvidia.com/gpumem: 10000  # 10GB GPU memory
        requests:
          cpu: "8"
          memory: "32Gi"

---
# Example 3: Multi-tenant GPU sharing (different teams on same GPU)
# Team A: Computer Vision model (30GB GPU memory)
# Team B: NLP model (20GB GPU memory)
# Both run on same A100 (80GB total)

apiVersion: v1
kind: Pod
metadata:
  name: team-a-vision-training
  namespace: team-a
  labels:
    team: a
    workload: vision
spec:
  containers:
    - name: resnet-trainer
      image: pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime
      command: ["sleep", "infinity"]
      resources:
        limits:
          nvidia.com/gpu: 1
          nvidia.com/gpumem: 30000  # 30GB for ResNet-152
        requests:
          cpu: "16"
          memory: "64Gi"

---
