# ABOUTME: HAMi GPU sharing examples demonstrating 57% cost savings without latency penalty
# ABOUTME: Shows memory isolation, multi-tenancy, and comparison with time-slicing

---
# Example 1: Single GPU shared by 4 small inference pods
# Without sharing: Need 4 GPUs ($32/hour) = $128/hour
# With HAMi: 1 GPU ($32/hour) shared by 4 pods = $32/hour
# Savings: 75% ($96/hour saved)

apiVersion: v1
kind: Pod
metadata:
  name: inference-pod-1
  namespace: ml-inference
  labels:
    app: bert-inference
    instance: "1"
spec:
  containers:
    - name: bert-server
      image: huggingface/transformers-pytorch-gpu:latest
      command: [sh, -c]
      args:
        - |
          echo "BERT inference pod 1 starting..."
          echo "Allocated GPU memory: 2000 MiB"

          python3 << 'EOF'
          import torch
          from transformers import BertTokenizer, BertModel

          # HAMi limits GPU memory to 2000 MiB for this pod
          device = torch.device("cuda:0")
          tokenizer = BertTokenizer.from_pretrained('bert-base-uncased')
          model = BertModel.from_pretrained('bert-base-uncased').to(device)

          # Inference loop
          text = "HAMi enables GPU sharing without performance degradation"
          inputs = tokenizer(text, return_tensors="pt").to(device)

          with torch.no_grad():
              outputs = model(**inputs)

          print("Inference successful!")
          print(f"GPU memory allocated: {torch.cuda.memory_allocated(0) / 1024**2:.2f} MiB")
          EOF

          sleep infinity
      resources:
        limits:
          nvidia.com/gpu: 1  # Request 1 vGPU
          nvidia.com/gpumem: 2000  # 2000 MiB GPU memory (out of 80GB total on A100)
        requests:
          cpu: "2"
          memory: "4Gi"

