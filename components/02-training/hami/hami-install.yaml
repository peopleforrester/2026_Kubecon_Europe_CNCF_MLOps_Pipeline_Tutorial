---
# Quick install command (Helm recommended):
# helm repo add hami-charts https://project-hami.github.io/HAMi/
# helm repo update
# helm install hami hami-charts/hami \
#   --set scheduler.kubeScheduler.imageTag=v1.28.0 \
#   --set devicePlugin.enabled=true \
#   --namespace hami-system \
#   --create-namespace
#
# Verify installation:
# kubectl get pods -n hami-system
# kubectl logs -n hami-system -l app=hami-device-plugin
#
# Check GPU resources:
# kubectl describe node <gpu-node-name> | grep nvidia.com
#
# Expected output:
#   nvidia.com/gpu: 8
#   nvidia.com/gpumem: 80000 (total GPU memory in MiB)
#   nvidia.com/gpucores: 800 (total GPU cores, 8 GPUs * 100)
