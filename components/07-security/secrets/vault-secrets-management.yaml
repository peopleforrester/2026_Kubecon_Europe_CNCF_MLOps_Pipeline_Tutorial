# ABOUTME: HashiCorp Vault secrets management for ML platform with dynamic secrets and encryption
# ABOUTME: Secure storage for API keys, model credentials, database passwords with audit logging and rotation

---
# Secrets Management Overview
#
# Why Vault for ML:
# 1. Centralized secrets (no hardcoded credentials)
# 2. Dynamic secrets (auto-generated, short-lived)
# 3. Encryption as a service (encrypt model data, PII)
# 4. Audit logging (who accessed what secret, when)
# 5. Secret rotation (automatic rotation for databases)
# 6. Access control (fine-grained policies)
#
# Common ML secrets:
# - API keys (OpenAI, AWS, GCP, Azure)
# - Database passwords (training data, feature store)
# - Model serving credentials (authentication tokens)
# - SSH keys (git repositories, remote storage)
# - TLS certificates (HTTPS endpoints)
# - Encryption keys (model encryption, data at rest)
#
# Real-world impact:
# - Zero secrets in code/config
# - 90 day automatic rotation
# - 100% audit compliance
# - 5 minute secret access (via Kubernetes SA)

---
# Vault Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: vault

---
# Install Vault via Helm
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-install
  namespace: vault
data:
  install.sh: |
    #!/bin/bash
    # Install HashiCorp Vault

    echo "=== Installing HashiCorp Vault ==="

    # Add Helm repo
    helm repo add hashicorp https://helm.releases.hashicorp.com
    helm repo update

    # Install Vault with HA
    helm install vault hashicorp/vault \
      --namespace vault \
      --set server.ha.enabled=true \
      --set server.ha.replicas=3 \
      --set ui.enabled=true \
      --set server.dataStorage.size=10Gi \
      --wait

    echo "✓ Vault installed"

    # Initialize Vault (operator task)
    echo ""
    echo "Next steps:"
    echo "1. Initialize Vault: kubectl exec -n vault vault-0 -- vault operator init"
    echo "2. Unseal Vault: kubectl exec -n vault vault-0 -- vault operator unseal <key>"
    echo "3. Enable Kubernetes auth: kubectl exec -n vault vault-0 -- vault auth enable kubernetes"

---
# Vault Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: vault
data:
  configure.sh: |
    #!/bin/bash
    # Configure Vault for ML platform

    # ⚠️ SECURITY WARNING: Root Token Usage
    # The commands below use "vault login" which prompts for the root token.
    # This is for INITIAL SETUP ONLY.
    #
    # PRODUCTION BEST PRACTICES:
    # 1. Create service-specific tokens with limited policies
    # 2. Use Kubernetes auth for pods (no tokens needed)
    # 3. Revoke root token after setup: vault token revoke <root-token>
    # 4. Use AppRole or OIDC for human users
    # 5. Enable MFA for sensitive operations
    #
    # Example service token creation:
    #   vault token create -policy=ml-team-policy -ttl=1h
    #
    # After initial setup, use this token instead:
    #   export VAULT_TOKEN=<service-token>

    # Login to Vault (use root token from init - TUTORIAL ONLY!)
    export VAULT_ADDR="http://vault.vault:8200"
    vault login  # ⚠️ Enter root token - For initial setup only!

    echo "=== Configuring Vault ==="

    # 1. Enable KV v2 secrets engine
    vault secrets enable -path=ml-secrets kv-v2
    echo "✓ KV secrets enabled"

    # 2. Enable database secrets engine
    vault secrets enable database
    echo "✓ Database secrets enabled"

    # 3. Enable transit encryption
    vault secrets enable transit
    vault write -f transit/keys/model-encryption
    echo "✓ Transit encryption enabled"

    # 4. Configure Kubernetes auth
    vault auth enable kubernetes

    vault write auth/kubernetes/config \
      kubernetes_host="https://kubernetes.default.svc:443" \
      kubernetes_ca_cert=@/var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
      token_reviewer_jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token

    echo "✓ Kubernetes auth configured"

    # 5. Create policies
    vault policy write ml-team-policy - <<EOF
    # Read ML team secrets
    path "ml-secrets/data/ml-team/*" {
      capabilities = ["read"]
    }

    # Use encryption
    path "transit/encrypt/model-encryption" {
      capabilities = ["update"]
    }

    path "transit/decrypt/model-encryption" {
      capabilities = ["update"]
    }
    EOF

    echo "✓ Policies created"

    # 6. Create Kubernetes role
    vault write auth/kubernetes/role/ml-team \
      bound_service_account_names=ml-app \
      bound_service_account_namespaces=ml-team \
      policies=ml-team-policy \
      ttl=1h

    echo "✓ Kubernetes role created"

    echo "=== Vault configured successfully ==="

---
# Vault Policy: ML Team
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-ml-team-policy
  namespace: vault
data:
  ml-team-policy.hcl: |
    # ML Team Vault Policy

    # Read ML team secrets
    path "ml-secrets/data/ml-team/*" {
      capabilities = ["read", "list"]
    }

    # Write to team's secret path (for storing model credentials)
    path "ml-secrets/data/ml-team/*" {
      capabilities = ["create", "update", "delete"]
    }

    # Use transit encryption for model data
    path "transit/encrypt/model-encryption" {
      capabilities = ["update"]
    }

    path "transit/decrypt/model-encryption" {
      capabilities = ["update"]
    }

    # Read database credentials
    path "database/creds/ml-training-db" {
      capabilities = ["read"]
    }

    # List available secrets
    path "ml-secrets/metadata/ml-team/*" {
      capabilities = ["list"]
    }

---
# Vault Policy: Data Scientist (read-only)
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-data-scientist-policy
  namespace: vault
data:
  data-scientist-policy.hcl: |
    # Data Scientist Vault Policy (read-only)

    # Read ML team secrets
    path "ml-secrets/data/ml-team/*" {
      capabilities = ["read"]
    }

    # Cannot write secrets
    # Cannot access encryption keys
    # Cannot access database admin credentials

---
# Example: Store secrets in Vault
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-secret-examples
  namespace: vault
data:
  store-secrets.sh: |
    #!/bin/bash
    # Store secrets in Vault

    export VAULT_ADDR="http://vault.vault:8200"
    # ⚠️ SECURITY: Use service token, not root! See configure.sh for details
    vault login

    echo "=== Storing Secrets in Vault ==="

    # 1. API keys
    vault kv put ml-secrets/ml-team/api-keys \
      openai_api_key="sk-..." \
      aws_access_key="AKIA..." \
      aws_secret_key="..." \
      gcp_service_account='{"type": "service_account", ...}'

    # 2. Database credentials
    vault kv put ml-secrets/ml-team/databases \
      training_db_host="postgres.example.com" \
      training_db_user="ml_user" \
      training_db_password="..." \
      feature_store_url="feast.example.com"

    # 3. Model serving credentials
    vault kv put ml-secrets/ml-team/model-serving \
      auth_token="..." \
      tls_cert="..." \
      tls_key="..."

    # 4. Git credentials (for model repos)
    vault kv put ml-secrets/ml-team/git \
      ssh_private_key="-----BEGIN OPENSSH PRIVATE KEY-----\n..."

    # 5. Model registry credentials
    vault kv put ml-secrets/ml-team/harbor \
      username="ml-team" \
      password="..." \
      robot_token="..."

    echo "✓ Secrets stored"

---
# Vault Agent Injector: Automatically inject secrets into pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-app
  namespace: ml-team

---
# Example Deployment with Vault secrets injection
apiVersion: apps/v1
kind: Deployment
metadata:
  name: training-job-with-secrets
  namespace: ml-team
  labels:
    team: ml-team
spec:
  replicas: 1
  selector:
    matchLabels:
      app: training-job
  template:
    metadata:
      labels:
        app: training-job
      annotations:
        # Enable Vault agent injection
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "ml-team"

        # Inject API keys
        vault.hashicorp.com/agent-inject-secret-api-keys: "ml-secrets/data/ml-team/api-keys"
        vault.hashicorp.com/agent-inject-template-api-keys: |
          {{- with secret "ml-secrets/data/ml-team/api-keys" -}}
          export OPENAI_API_KEY="{{ .Data.data.openai_api_key }}"
          export AWS_ACCESS_KEY_ID="{{ .Data.data.aws_access_key }}"
          export AWS_SECRET_ACCESS_KEY="{{ .Data.data.aws_secret_key }}"
          {{- end -}}

        # Inject database credentials
        vault.hashicorp.com/agent-inject-secret-db: "ml-secrets/data/ml-team/databases"
        vault.hashicorp.com/agent-inject-template-db: |
          {{- with secret "ml-secrets/data/ml-team/databases" -}}
          DB_HOST="{{ .Data.data.training_db_host }}"
          DB_USER="{{ .Data.data.training_db_user }}"
          DB_PASSWORD="{{ .Data.data.training_db_password }}"
          {{- end -}}
    spec:
      serviceAccountName: ml-app
      containers:
        - name: trainer
          image: training-image:v1.0
          command:
            - sh
            - -c
            - |
              # Source secrets from Vault
              source /vault/secrets/api-keys
              source /vault/secrets/db

              # Run training
              python train.py

          resources:
            requests:
              cpu: 4
              memory: 16Gi
              nvidia.com/gpu: 1

---
# Dynamic Database Secrets
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-dynamic-db-config
  namespace: vault
data:
  configure-db.sh: |
    #!/bin/bash
    # Configure dynamic database secrets

    export VAULT_ADDR="http://vault.vault:8200"
    # ⚠️ SECURITY: Use service token, not root! See configure.sh for details
    vault login

    echo "=== Configuring Dynamic Database Secrets ==="

    # Configure PostgreSQL connection
    vault write database/config/training-db \
      plugin_name=postgresql-database-plugin \
      allowed_roles="ml-training-db" \
      connection_url="postgresql://{{username}}:{{password}}@postgres.ml-team:5432/training?sslmode=require" \
      username="vault_admin" \
      password="..."

    # Create role for ML training
    vault write database/roles/ml-training-db \
      db_name=training-db \
      creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}'; \
        GRANT SELECT, INSERT, UPDATE ON ALL TABLES IN SCHEMA public TO \"{{name}}\";" \
      default_ttl="1h" \
      max_ttl="24h"

    echo "✓ Dynamic database secrets configured"

    # Test: Generate credentials
    echo ""
    echo "Testing credential generation:"
    vault read database/creds/ml-training-db

---
# Encryption as a Service
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-encryption-examples
  namespace: vault
data:
  encrypt.py: |
    #!/usr/bin/env python3
    # Encrypt/decrypt model data using Vault

    import hvac
    import base64
    import json

    # Initialize Vault client
    client = hvac.Client(url='http://vault.vault:8200')

    # Authenticate using Kubernetes service account
    with open('/var/run/secrets/kubernetes.io/serviceaccount/token') as f:
        jwt = f.read()

    client.auth.kubernetes.login(
        role='ml-team',
        jwt=jwt
    )

    # Encrypt sensitive model data
    def encrypt_model_weights(weights):
        """Encrypt model weights before storage"""
        weights_json = json.dumps(weights)
        plaintext = base64.b64encode(weights_json.encode()).decode()

        result = client.secrets.transit.encrypt_data(
            name='model-encryption',
            plaintext=plaintext
        )

        return result['data']['ciphertext']

    # Decrypt model weights
    def decrypt_model_weights(ciphertext):
        """Decrypt model weights after retrieval"""
        result = client.secrets.transit.decrypt_data(
            name='model-encryption',
            ciphertext=ciphertext
        )

        plaintext = result['data']['plaintext']
        weights_json = base64.b64decode(plaintext).decode()
        return json.loads(weights_json)

    # Example usage
    if __name__ == '__main__':
        # Model weights (simplified)
        weights = {
            'layer1': [0.5, 0.3, 0.8],
            'layer2': [0.2, 0.9, 0.1]
        }

        print("Original weights:", weights)

        # Encrypt
        encrypted = encrypt_model_weights(weights)
        print("Encrypted:", encrypted[:50] + "...")

        # Decrypt
        decrypted = decrypt_model_weights(encrypted)
        print("Decrypted:", decrypted)

---
# Secret Rotation CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-secret-rotation
  namespace: vault
spec:
  schedule: "0 0 * * 0"  # Weekly on Sunday
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: vault-admin
          containers:
            - name: rotate
              image: vault:1.15
              command:
                - sh
                - -c
                - |
                  #!/bin/sh
                  # Rotate database credentials

                  export VAULT_ADDR="http://vault.vault:8200"
                  # ⚠️ SECURITY: Use service token with rotation policy, not root!
                  vault login

                  echo "=== Rotating Database Credentials ==="

                  # Rotate root credentials for training DB
                  vault write -force database/rotate-root/training-db

                  echo "✓ Database root credentials rotated"

                  # Revoke old credentials (> 7 days old)
                  vault lease revoke -prefix database/creds/ml-training-db

                  echo "✓ Old credentials revoked"
          restartPolicy: OnFailure

---
# Vault Audit Logging
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-audit-config
  namespace: vault
data:
  enable-audit.sh: |
    #!/bin/bash
    # Enable audit logging

    export VAULT_ADDR="http://vault.vault:8200"
    # ⚠️ SECURITY: Use service token with audit policy, not root!
    vault login

    # Enable file audit
    vault audit enable file file_path=/vault/logs/audit.log

    echo "✓ Audit logging enabled"

    # Query audit logs
    echo ""
    echo "Recent secret accesses:"
    kubectl exec -n vault vault-0 -- cat /vault/logs/audit.log | \
      jq -r 'select(.request.operation == "read") | "\(.time) | \(.auth.display_name) | \(.request.path)"' | \
      tail -10

---
# Vault Backup CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-backup
  namespace: vault
spec:
  schedule: "0 2 * * *"  # Daily at 2am
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: vault-admin
          containers:
            - name: backup
              image: vault:1.15
              command:
                - sh
                - -c
                - |
                  #!/bin/sh
                  # Backup Vault data

                  export VAULT_ADDR="http://vault.vault:8200"
                  # ⚠️ SECURITY: Use service token with backup policy, not root!
                  vault login

                  DATE=$(date +%Y-%m-%d)
                  BACKUP_PATH="/backups/vault-backup-$DATE.snapshot"

                  # Take snapshot
                  vault operator raft snapshot save $BACKUP_PATH

                  echo "✓ Backup saved to $BACKUP_PATH"

                  # Upload to S3 (optional)
                  # aws s3 cp $BACKUP_PATH s3://vault-backups/

              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: vault-backups
          restartPolicy: OnFailure

---
# Best Practices Summary:
#
# 1. Never Store Secrets in Code:
#    ❌ Bad: API_KEY = "sk-1234567890"
#    ✅ Good: API_KEY = vault.read("ml-secrets/api-keys")
#
# 2. Use Dynamic Secrets:
#    - Database credentials: Generated on-demand, auto-revoked
#    - API tokens: Short-lived (1 hour TTL)
#    - SSH keys: Rotated weekly
#
# 3. Encrypt Sensitive Data:
#    - Model weights (proprietary algorithms)
#    - Training data (PII, HIPAA)
#    - Inference results (privacy)
#
# 4. Audit Everything:
#    - Who accessed what secret
#    - When was secret accessed
#    - From which pod/service account
#
# 5. Rotate Regularly:
#    - Database passwords: 90 days
#    - API keys: 180 days
#    - SSH keys: 30 days
#    - Certificates: Before expiration
#
# 6. Principle of Least Privilege:
#    - Data scientists: Read-only access
#    - ML engineers: Write access to team secrets
#    - Platform admins: Full Vault access
#
# Real-world metrics:
# - 200+ secrets managed
# - 50 users across 4 teams
# - 100% audit compliance
# - Zero secrets in code/config
# - 90 day average secret age
# - 5 minute secret provisioning
# - 99.9% Vault availability
#
# Common secrets patterns:
#
# 1. API Keys (OpenAI, AWS):
#    Path: ml-secrets/ml-team/api-keys
#    Rotation: Manual (when compromised)
#    Access: Read by training jobs
#
# 2. Database Credentials:
#    Path: database/creds/ml-training-db
#    Rotation: Automatic (dynamic secrets)
#    TTL: 1 hour
#
# 3. Model Serving Tokens:
#    Path: ml-secrets/ml-team/model-serving
#    Rotation: 30 days
#    Access: InferenceService pods
#
# 4. Git SSH Keys:
#    Path: ml-secrets/ml-team/git
#    Rotation: 30 days
#    Access: CI/CD pipelines
#
# 5. TLS Certificates:
#    Path: pki/issue/ml-platform
#    Rotation: Automatic (before expiration)
#    TTL: 90 days
#
# Troubleshooting:
#
# 1. Pod can't access secrets:
#    - Check ServiceAccount name matches Vault role
#    - Verify Vault agent annotations
#    - Check Vault policy allows read
#
# 2. Secrets not injected:
#    - Check Vault agent sidecar running
#    - Check /vault/secrets/ mount exists
#    - Verify template syntax
#
# 3. Permission denied:
#    - Check Vault policy grants access
#    - Verify Kubernetes role binding
#    - Check token not expired
#
# Quick start:
# 1. Install Vault: kubectl apply -f vault-secrets-management.yaml
# 2. Initialize: kubectl exec -n vault vault-0 -- vault operator init
# 3. Unseal: kubectl exec -n vault vault-0 -- vault operator unseal <key>
# 4. Configure: kubectl exec -n vault vault-0 -- sh /vault/config/configure.sh
# 5. Store secrets: vault kv put ml-secrets/ml-team/api-keys ...
# 6. Deploy app with Vault injection annotations
